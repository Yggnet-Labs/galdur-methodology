## EXECUTION BODY — machine-readable

governance:
  level: collaborative        # Ops default is higher than Dev
  # L2 collaborative = agent plans → human approves → executes
  # L3 manual        = human executes, agent assists
  escalate_on:
    - production_impact
    - blast_radius_expansion
    - security_sensitive
    - irreversible_action
  escalation_to: ""
  timeout_hours: 2            # shorter timeout for Ops
  change_window_required: false

