# ============================================================================
# GALDUR Intent Spec — DEV variant (full template)
# GALDUR v0.95 · MIT License · getgaldur.com
# ----------------------------------------------------------------------------
# For isolated development tasks (code, tests, docs, analysis). Appendix A of
# the methodology is a strict SUBSET of this file: every field shown there
# exists here under the same name. Mandatory fields (ch. 04): intent, domain,
# out_of_scope, constraints, acceptance, governance_level, curator,
# timeout_hours. The loop contract becomes mandatory when execution_mode: loop
# (AM-1). Everything else is optional — delete what you do not use.
# ============================================================================

## IDENTIFICATION
id: IS-YYYY-NNN
domain: dev
title: ""
status: draft                    # lifecycle state — see ch. 05 (draft → crystallized → active → …)
version: "1.0"                   # optional: spec revision (Amendments bump it)
created_by: ""                   # optional
created_at: ""                   # optional, ISO-8601

## HEADER — human-authored

intent: |
  # WHY we do this and what it unlocks (1–3 sentences of business context).
  # Outcome, not implementation. A vague intent cannot be rescued downstream.

acceptance:                      # binary, machine-testable criteria for the Validation Gate
  # TAMPER-RESISTANT (AM-2): acceptance criteria and the tests that verify them
  # are READ-ONLY for the executing agent. It reads and fulfils them; it must
  # not change, delete or weaken them — not even temporarily, not even inside
  # a loop. The only way to change them is an Amendment. An attempt = drift
  # event constraint_breach (in loops: immediate Suspend).
  - ""

in_scope: []                     # optional — what IS included, when it helps clarity
out_of_scope:                    # REQUIRED — agents scope-creep (ch. 04)
  - ""
constraints:                     # negative rules the agent must never violate
  - ""

context: |
  # Technical context the agent needs to execute (repos, conventions, links).

trust_boundary: internal         # internal | external — external = the spec consumes
                                 # untrusted inputs (e-mail, web, uploads, other agents'
                                 # output) → governance level is raised by one (ch. 10)

## EXECUTION

execution_mode: single           # single | loop (AM-1)
# If execution_mode: loop, the full loop contract is REQUIRED — use
# intent-spec-loop.yaml (max_iterations, completion_promise, evaluator, loop_budget).

governance_level: L1             # L0=autonomous | L1=supervised | L2=collaborative | L3=manual
                                 # ONE level per spec (v0.95: governance is per-spec, not
                                 # per-task — split mixed-sensitivity work into two specs)
governance_level_reason: ""      # one line: why this level — recommended, not a ch. 04 mandatory field
curator: ""                      # named human owner of the Validation Gate (REQUIRED — ch. 04)
timeout_hours: 4                 # max wait in SUSPENDED before escalation

escalation:
  triggers: [
    schema_changes,
    new_external_dependency,
    security_sensitive
  ]
  escalate_to: ""                # named human (defaults to curator)

## DEPENDENCIES

depends_on: []                   # specs that must be Validated first
blocks: []                       # specs waiting for this one

## RISK (optional for dev; mandatory for ops — see intent-spec-ops.yaml)

risk_assessment:
  blast_radius: low              # low | medium | high | critical
  reversibility: easy            # easy | partial | hard | irreversible
  rollback_plan: ""

## TASKS — machine-readable

tasks: []
# - id: IS-NNN-T1
#   title: ""
#   type: implementation         # implementation | testing | documentation | analysis
#   agent_role: coding_agent     # coding_agent | docs_agent | analysis_agent
#   depends_on: []
#   pre_conditions: []
#   acceptance: ""               # task-level check; spec-level acceptance above stays authoritative
#   rollback: ""
#   timeout_hours: 2
#   # NOTE (v0.95): there is NO per-task governance_override. If a task needs a
#   # different level, it belongs in a separate spec linked via depends_on.

## VALIDATION GATE

validation:
  reviewer: ""                   # defaults to curator
  checklist:
    - "Acceptance criteria met?"
    - "No constraint violated?"
    - "Drift report read and understood?"
    - "Rollback plan verified (if applicable)?"

## AUDIT TRAIL

drift_log: []                    # filled by the agent + governance engine
# - task_id: IS-NNN-T1
#   timestamp: YYYY-MM-DDTHH:MM:SSZ
#   type: scope_drift | constraint_breach | technical_deviation |
#         inferred_decision | escalation | timeout | amendment_proposed
#   description: ""
#   resolution: approved | reverted | escalated | accepted_with_note
#   resolved_by: ""
