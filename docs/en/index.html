/* GALDUR Methodology — Variant A · Klasika
   Final stylesheet for the 59-page methodology.
   Typografie: Source Serif 4 (serif) + Inter Tight (sans) + JetBrains Mono (mono)
   Primary: GALDUR blue #1E3A8A */

:root {
  --page-w: 210mm;
  --page-h: 297mm;
  --page-pad-x: 22mm;
  --page-pad-y: 20mm;

  --ink:       #0F1E3D;
  --ink-soft:  #1E3A8A;
  --ink-mute:  #475569;
  --ink-faint: #94a3b8;
  --line:      #DCE0E8;
  --line-2:    #B7BECC;
  --paper:     #FFFFFF;
  --paper-alt: #F5F7FB;
  --paper-2:   #EEF1F7;
  --accent:    #1E3A8A;

  --c-green:  #2F855A; --c-green-bg:  #E6F4EB;
  --c-ochre:  #B7791F; --c-ochre-bg:  #FBF4E0;
  --c-purple: #6B3AA0; --c-purple-bg: #EFE8F7;
  --c-red:    #B91C1C; --c-red-bg:    #FBEAEA;
  --c-teal:   #0E7490; --c-teal-bg:   #E0F2F7;

  --f-serif: "Source Serif 4", "Source Serif Pro", Georgia, serif;
  --f-sans:  "Inter Tight", "Inter", system-ui, sans-serif;
  --f-mono:  "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: #e9e9ed;
  font-family: var(--f-sans);
  color: var(--ink);
  font-size: 10.5pt;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-feature-settings: "kern" 1, "liga" 0, "dlig" 0, "calt" 0;
}

.doc {
  max-width: calc(var(--page-w) + 20mm);
  margin: 0 auto;
  padding: 16mm 0 24mm;
}

/* ---- Top bar (screen only) ---- */
.topbar {
  position: sticky; top: 0; z-index: 100;
  display: flex; gap: 10px; justify-content: center; align-items: center;
  padding: 8px 12px; background: rgba(255,255,255,.94);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid #d5d5da;
  font: 500 11.5px/1 var(--f-sans);
  letter-spacing: .04em;
}
.topbar__title { font-family: var(--f-serif); font-weight: 600; color: var(--ink); font-size: 14px; letter-spacing: 0; }
.topbar__meta { color: #666; font-weight: 400; }
.topbar a {
  text-decoration: none; color: var(--ink); border: 1px solid var(--line-2);
  padding: 5px 10px; border-radius: 999px; font-size: 11px;
  letter-spacing: .06em; text-transform: uppercase;
}
.topbar a:hover { background: var(--ink); color: #fff; border-color: var(--ink); }

/* ---- Page frame ---- */
.page {
  width: var(--page-w);
  min-height: var(--page-h);
  margin: 10mm auto;
  background: var(--paper);
  padding: var(--page-pad-y) var(--page-pad-x);
  box-shadow: 0 2px 8px rgba(0,0,0,.08), 0 30px 60px -20px rgba(0,0,0,.12);
  position: relative;
  page-break-after: always;
  overflow: hidden;
  color: var(--ink);
}
.page--tight { padding-top: 14mm; padding-bottom: 14mm; }
.url { white-space: nowrap; hyphens: none; } /* URLs break only after a slash (<wbr>), never at a hyphen */
.page__num {
  position: absolute;
  bottom: 10mm; left: 0; right: 0;
  text-align: center;
  font-family: var(--f-sans); font-weight: 500;
  font-size: 9pt; color: var(--ink-faint);
  letter-spacing: .06em;
}
.page__header {
  position: absolute;
  top: 10mm; left: var(--page-pad-x); right: var(--page-pad-x);
  font-family: var(--f-sans); font-weight: 500;
  font-size: 8.5pt; color: var(--ink-faint);
  letter-spacing: .14em; text-transform: uppercase;
  display: flex; justify-content: space-between; align-items: center;
}
.page__header .l { color: var(--ink-mute); }
.page__header .r { }
.page__footer {
  position: absolute;
  bottom: 14mm; left: var(--page-pad-x); right: var(--page-pad-x);
  font-family: var(--f-sans); font-size: 8pt;
  color: var(--ink-faint); letter-spacing: .04em;
  display: flex; justify-content: space-between;
}

/* ===========================================================
   COVER (page 1)
=========================================================== */
.cover { display: flex; flex-direction: column; min-height: calc(var(--page-h) - 2*var(--page-pad-y)); }
.cover__kicker {
  align-self: center;
  font-family: var(--f-sans); font-weight: 500;
  font-size: 9.5px; letter-spacing: .32em; color: var(--ink);
  text-transform: uppercase;
  padding: 8px 14px; border: 1px solid var(--ink);
  margin-top: 18mm;
}
.cover__logo {
  font-family: var(--f-serif); font-weight: 700;
  font-size: 84pt; letter-spacing: -.02em;
  color: var(--ink); text-align: center;
  margin: 26mm 0 12mm; line-height: 1;
}
.cover__etym {
  font-family: var(--f-sans);
  font-size: 10pt; color: var(--ink-mute); font-weight: 400;
  text-align: center; max-width: 140mm; margin: 0 auto;
  line-height: 1.6;
}
.cover__etym em { font-style: italic; color: var(--ink); font-weight: 600; }
.cover__sub {
  font-family: var(--f-serif); font-style: italic;
  font-size: 15pt; text-align: center;
  color: var(--ink-soft); margin: 10mm auto 0;
  max-width: 150mm; line-height: 1.35;
}
.cover__foot {
  font-family: var(--f-sans); font-weight: 500;
  letter-spacing: .02em;
  font-size: 8pt; color: var(--ink-mute);
  text-align: center; margin-top: 8mm;
}

/* Ecosystem */
.eco {
  margin-top: 10mm;
  padding: 10mm 8mm;
  border: 1px solid var(--line);
  border-radius: 2px;
  background: var(--paper-alt);
}
.eco__title {
  font-family: var(--f-mono); font-size: 8.5pt;
  letter-spacing: .22em; text-align: center;
  color: var(--ink); margin-bottom: 6mm;
}
.eco__tagline {
  margin-top: 8mm;
  padding: 4mm 6mm;
  border-left: 3px solid var(--accent);
  background: #fff;
  font-family: var(--f-serif); font-style: italic;
  font-size: 11pt; color: var(--ink); line-height: 1.5;
}
.eco__tagline p { margin: 0 0 2mm; }
.eco__tagline p:last-child { margin: 0; }

/* ===========================================================
   SECTION / PAGE PRIMITIVES
=========================================================== */
.section-kicker {
  font-family: var(--f-sans); font-weight: 500;
  font-size: 9pt; text-transform: uppercase;
  letter-spacing: .24em; color: var(--ink);
  padding-bottom: 4mm; border-bottom: 1.5px solid var(--ink);
  margin-bottom: 8mm;
}
.section-head { margin: 0 0 5mm; }
.section-head__num {
  font-family: var(--f-mono); font-size: 9pt;
  letter-spacing: .2em; color: var(--ink-mute);
}
.section-head__title {
  font-family: var(--f-serif); font-weight: 700;
  font-size: 26pt; line-height: 1.05;
  color: var(--ink); margin: 3mm 0 4mm;
  letter-spacing: -.01em;
}
.section-head__title em {
  font-style: italic; color: var(--ink-soft); font-weight: 700;
}
.section-head__rule { height: 1px; background: var(--ink); }
.section-intro {
  font-size: 10.5pt; line-height: 1.55;
  color: var(--ink); margin: 4mm 0 5mm;
  max-width: 155mm;
  text-wrap: pretty;
}

/* Subheads inside a section */
.h2 {
  font-family: var(--f-serif); font-weight: 700;
  font-size: 14.5pt; line-height: 1.15; color: var(--ink);
  margin: 5mm 0 2.5mm; letter-spacing: -.005em;
}
.h2 em { font-style: italic; color: var(--ink-soft); font-weight: 700; }
.h3 {
  font-family: var(--f-serif); font-weight: 600;
  font-size: 12.5pt; color: var(--ink);
  margin: 4mm 0 2mm;
}
.kicker-sm {
  font-family: var(--f-mono);
  font-size: 8pt; letter-spacing: .22em;
  text-transform: uppercase; color: var(--ink-mute);
  margin-bottom: 2mm;
}

/* Body prose */
.prose p { margin: 0 0 2.5mm; text-wrap: pretty; font-size: 10pt; line-height: 1.55; }
.prose p + p { margin-top: 0; }
.prose strong { color: var(--ink); font-weight: 600; }
.prose em { font-style: italic; }
.prose ul, .prose ol { margin: 2mm 0 4mm 6mm; padding: 0; }
.prose li { margin-bottom: 1.5mm; line-height: 1.55; }
.prose ul { list-style: none; padding-left: 0; margin-left: 0; }
.prose ul > li {
  position: relative; padding-left: 6mm;
}
.prose ul > li::before {
  content: "—"; position: absolute; left: 0; color: var(--ink-soft); font-weight: 600;
}
.prose ol { list-style: decimal; margin-left: 6mm; }
.prose ol li::marker { color: var(--ink-soft); font-weight: 600; font-family: var(--f-mono); font-size: 9pt; }

/* Pull quote / principle block */
.pullquote {
  border-left: 3px solid var(--accent);
  background: var(--paper-alt);
  padding: 5mm 6mm;
  font-family: var(--f-serif); font-style: italic;
  font-size: 12pt; line-height: 1.5;
  color: var(--ink); margin: 4mm 0;
}
.pullquote p { margin: 0 0 2mm; }
.pullquote p:last-child { margin: 0; }
.pullquote--strong {
  background: var(--ink);
  color: #fff; border-color: #fff;
}
.pullquote--strong em { color: #fff; opacity: .9; }

/* Callout box */
.callout {
  padding: 4mm 5mm;
  margin: 3mm 0;
  background: var(--paper-alt);
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
}
.callout__label {
  font-family: var(--f-mono); font-size: 8pt; letter-spacing: .16em;
  text-transform: uppercase; color: var(--ink-soft);
  margin-bottom: 2mm;
}
.callout__body { font-size: 10pt; line-height: 1.55; }
.callout--ochre { border-left-color: var(--c-ochre); background: var(--c-ochre-bg); }
.callout--ochre .callout__label { color: var(--c-ochre); }
.callout--green { border-left-color: var(--c-green); background: var(--c-green-bg); }
.callout--green .callout__label { color: var(--c-green); }
.callout--red   { border-left-color: var(--c-red);   background: var(--c-red-bg); }
.callout--red   .callout__label { color: var(--c-red); }
.callout--purple{ border-left-color: var(--c-purple); background: var(--c-purple-bg); }
.callout--purple .callout__label { color: var(--c-purple); }

/* Definition list / key-value grid */
.kv {
  display: grid; grid-template-columns: 44mm 1fr;
  gap: 1.5mm 5mm; margin: 2mm 0 3mm;
}
.kv dt {
  font-family: var(--f-sans); font-weight: 600;
  font-size: 9.5pt; color: var(--ink-soft);
  text-transform: uppercase; letter-spacing: .08em;
  padding-top: .3mm;
}
.kv dd {
  margin: 0; font-size: 10pt; line-height: 1.55;
}

/* ===========================================================
   TOC
=========================================================== */
.toc__title {
  font-family: var(--f-serif); font-weight: 700;
  font-size: 22pt; color: var(--ink);
  margin: 0 0 1.5mm; letter-spacing: -.01em;
}
.toc__subtitle {
  font-family: var(--f-serif); font-style: italic;
  font-size: 10pt; color: var(--ink-soft);
  margin: 0 0 3mm;
}
.toc__section {
  font-family: var(--f-mono); font-size: 7pt; letter-spacing: .2em;
  text-transform: uppercase; color: var(--ink-mute);
  margin: 2.5mm 0 1mm;
  padding-bottom: 0.6mm; border-bottom: 1px solid var(--line);
}
.toc__item {
  display: grid; grid-template-columns: 9mm 1fr auto;
  gap: 2.5mm; align-items: baseline;
  padding: 0.4mm 0;
  border-bottom: 1px dotted var(--line);
  font-size: 8.4pt;
}
.toc__num {
  font-family: var(--f-mono); font-weight: 500;
  font-size: 8pt; color: var(--ink-soft);
}
.toc__name { color: var(--ink); }
.toc__name em { font-style: italic; color: var(--ink-mute); font-weight: 400; }
.toc__page {
  font-family: var(--f-mono); font-size: 8pt;
  color: var(--ink-mute);
}

/* ===========================================================
   GOVERNANCE LEVELS
=========================================================== */
.levels { display: grid; gap: 3mm; }
.level {
  display: grid; grid-template-columns: 30mm 1fr;
  border: 1px solid var(--line);
  border-left-width: 4px;
  border-radius: 2px;
  overflow: hidden;
}
.level[data-tone="green"]  { border-left-color: var(--c-green); }
.level[data-tone="ochre"]  { border-left-color: var(--c-ochre); }
.level[data-tone="purple"] { border-left-color: var(--c-purple); }
.level[data-tone="red"]    { border-left-color: var(--c-red); }
.level__badge {
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  padding: 6mm 2mm;
  background: var(--paper-alt);
  border-right: 1px solid var(--line);
}
.level__code { font-family: var(--f-serif); font-weight: 700; font-size: 26pt; line-height: 1; color: var(--ink); }
.level__name { font-family: var(--f-mono); font-size: 7.5pt; letter-spacing: .14em; margin-top: 2mm; color: var(--ink-mute); }
.level__body { padding: 5mm 6mm; }
.level__caption { font-family: var(--f-serif); font-weight: 600; font-size: 12pt; color: var(--ink); margin-bottom: 1mm; }
.level__one   { font-size: 10.5pt; color: var(--ink); margin: 0 0 2mm; }
.level__touch { font-size: 9.5pt; color: var(--ink-mute); margin: 0 0 2mm; }
.level__ex    { font-family: var(--f-mono); font-size: 8.5pt; color: var(--ink-mute); letter-spacing: .01em; }
.level__ex::before {
  content: "Examples: "; text-transform: uppercase; letter-spacing: .1em;
  font-size: 7.5pt; color: var(--ink); margin-right: 2mm;
}

/* Cascade */
.cascade {
  margin-top: 4mm; border: 1px solid var(--line);
  padding: 4mm 5mm; background: var(--paper-alt);
}
.cascade__title {
  font-family: var(--f-mono); font-size: 8pt;
  letter-spacing: .22em; text-align: center; color: var(--ink);
  margin-bottom: 4mm;
}
.cascade__trigger {
  padding: 2mm 4mm; border: 1.5px solid var(--c-red);
  background: #fff; text-align: center;
  font-weight: 600; color: var(--c-red);
  font-size: 9.5pt; margin-bottom: 4mm;
}
.cascade__steps { display: grid; gap: 2mm; }
.cascade__step {
  display: grid; grid-template-columns: 9mm 1fr; gap: 4mm;
  align-items: start;
  padding: 2.2mm 3.5mm; border: 1px solid var(--line); background: #fff;
}
.cascade__n { font-family: var(--f-serif); font-size: 15pt; color: var(--accent); line-height: 1; padding-top: .5mm; }
.cascade__title-sm { font-family: var(--f-mono); font-size: 8pt; letter-spacing: .16em; color: var(--ink); margin-bottom: .8mm; }
.cascade__body { font-size: 9pt; color: var(--ink); line-height:1.4; }
.cascade__exit { font-family: var(--f-mono); font-size: 8pt; color: var(--c-green); margin-top: 1mm; letter-spacing: .08em; }
.cascade__options { display: flex; gap: 4mm; flex-wrap: wrap; margin-top: 2mm; }
.cascade__opt {
  border: 1px solid var(--line); padding: 2mm 3mm; background: var(--paper-alt);
}
.cascade__opt-l { font-family: var(--f-mono); font-size: 8pt; color: var(--ink); }
.cascade__opt-s { font-size: 8.5pt; color: var(--ink-mute); }

/* Calibration */
.calib { margin-top: 5mm; }

.cascade-svg {
  margin: 0 0 5mm;
  padding: 3mm 4mm 4mm;
  background: var(--paper-alt);
  border: 1px solid var(--line);
}
.cascade-svg__title {
  font-family: var(--f-mono);
  font-size: 8pt; letter-spacing: .22em;
  text-align: center; color: var(--ink);
  margin-bottom: 2mm;
}
.cascade-svg svg {
  width: 100%; height: auto; display: block;
}
.calib__title {
  font-family: var(--f-serif); font-weight: 700; font-size: 13pt;
  color: var(--ink); margin: 0 0 2mm;
}
.calib__intro { font-size: 9.5pt; color: var(--ink); margin: 0 0 3mm; line-height: 1.45; }
.calib__q { margin: 0 0 2.5mm; padding-left: 3.5mm; border-left: 2px solid var(--accent); }
.calib__qh { font-family: var(--f-mono); font-size: 8pt; letter-spacing: .12em; color: var(--ink); margin-bottom: 1mm; }
.calib__a { margin: 0; padding-left: 3.5mm; }
.calib__a li { font-size: 9.3pt; color: var(--ink); margin-bottom: .5mm; line-height: 1.4; }
.calib__tip {
  margin-top: 3mm; padding: 2.8mm 4mm;
  background: var(--c-ochre-bg);
  border-left: 3px solid var(--c-ochre);
  font-size: 9.3pt; color: var(--ink);
  font-style: italic;
  line-height: 1.45;
}
.calib--compact { margin-top: 3mm; }
.calib--compact .calib__title { font-size: 11.5pt; margin-bottom: 1.5mm; }
.calib--compact .calib__intro { font-size: 8.8pt; margin-bottom: 2mm; line-height: 1.4; }
.calib--compact .calib__q { margin-bottom: 1.5mm; padding-left: 3mm; }
.calib--compact .calib__qh { font-size: 7.5pt; margin-bottom: .5mm; }
.calib--compact .calib__a li { font-size: 8.5pt; margin-bottom: .3mm; line-height: 1.35; }
.calib--compact .calib__tip { margin-top: 2mm; padding: 2mm 3mm; font-size: 8.5pt; line-height: 1.4; }

/* ===========================================================
   TABLES
=========================================================== */
table.gtab {
  width: 100%; border-collapse: collapse;
  font-size: 9.5pt; margin: 3mm 0;
  border: 1px solid var(--line);
}
.gtab thead th {
  font-family: var(--f-sans); font-weight: 600;
  font-size: 8.5pt; letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--ink-soft);
  text-align: left;
  padding: 3mm 4mm;
  background: var(--paper-alt);
  border-bottom: 1.5px solid var(--ink);
}
.gtab tbody td {
  padding: 2.5mm 4mm;
  border-bottom: 1px solid var(--line);
  vertical-align: top;
  line-height: 1.5;
}
.gtab tbody tr:last-child td { border-bottom: 0; }
.gtab tbody tr:nth-child(even) td { background: var(--paper-alt); }
.gtab td.level-cell {
  font-family: var(--f-mono); font-weight: 500;
  font-size: 9pt; color: var(--ink-soft);
  white-space: nowrap;
}
.gtab td.level-cell[data-tone="green"]  { color: var(--c-green); }
.gtab td.level-cell[data-tone="ochre"]  { color: var(--c-ochre); }
.gtab td.level-cell[data-tone="purple"] { color: var(--c-purple); }
.gtab td.level-cell[data-tone="red"]    { color: var(--c-red); font-weight: 700; }
.gtab .note { color: var(--ink-mute); font-size: 9pt; }
.gtab caption {
  caption-side: top; text-align: left;
  font-family: var(--f-mono); font-size: 8pt; letter-spacing: .18em;
  text-transform: uppercase; color: var(--ink-mute);
  padding-bottom: 2mm;
}

/* Narrow table variant */
.gtab--narrow td, .gtab--narrow th { padding: 1.6mm 2.4mm; font-size: 8.6pt; line-height: 1.42; }

/* ===========================================================
   DIAGRAMS
=========================================================== */
.diagram {
  margin: 4mm 0;
  padding: 5mm 6mm;
  background: var(--paper-alt);
  border: 1px solid var(--line);
}
.diagram__title {
  font-family: var(--f-mono); font-size: 8.5pt;
  letter-spacing: .22em; text-align: center;
  color: var(--ink); margin-bottom: 4mm;
  text-transform: uppercase;
}
.diagram__caption {
  font-size: 9pt; color: var(--ink-mute);
  margin-top: 3mm; text-align: center; font-style: italic;
}

/* Horizontal flow — arrow chain */
.flow {
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
  gap: 0; align-items: stretch;
}
.flow__step {
  padding: 4mm 3mm; background: #fff;
  border: 1px solid var(--line);
  position: relative;
  text-align: center;
  border-right: 0;
}
.flow__step:last-child { border-right: 1px solid var(--line); }
.flow__step + .flow__step::before {
  content: "→"; position: absolute; left: -3mm; top: 50%;
  transform: translateY(-50%);
  background: var(--paper-alt);
  color: var(--ink-soft); font-weight: 700;
  padding: 0 1mm;
  font-size: 12pt;
}
.flow__code {
  font-family: var(--f-mono); font-size: 8pt;
  letter-spacing: .1em; color: var(--accent);
  margin-bottom: 1mm;
}
.flow__label {
  font-family: var(--f-serif); font-weight: 600;
  font-size: 10pt; color: var(--ink);
  line-height: 1.25;
}
.flow__sub {
  font-size: 8pt; color: var(--ink-mute);
  margin-top: 1mm;
}

/* Risk ladder (low → medium → high with tone) */
.risk-ladder {
  display: grid; grid-template-columns: repeat(7, 1fr);
  gap: 2mm; margin: 4mm 0;
}
.risk-ladder__bar {
  grid-column: 1 / -1;
  display: grid; grid-template-columns: 2fr 2fr 3fr;
  font-family: var(--f-mono); font-size: 7.5pt; letter-spacing: .2em;
  text-transform: uppercase; color: var(--ink-mute);
  margin-bottom: 1mm;
}
.risk-ladder__bar span { padding: 1mm 2mm; text-align: center; }
.risk-ladder__bar span:nth-child(1) { background: var(--c-green-bg); color: var(--c-green); }
.risk-ladder__bar span:nth-child(2) { background: var(--c-ochre-bg); color: var(--c-ochre); }
.risk-ladder__bar span:nth-child(3) { background: var(--c-red-bg); color: var(--c-red); }
.risk-item {
  padding: 3mm 2mm; background: #fff;
  border: 1px solid var(--line); text-align: center;
}
.risk-item__task { font-size: 8.5pt; color: var(--ink); line-height: 1.25; margin-bottom: 1mm; text-wrap: balance; }
.risk-item__lvl  { font-family: var(--f-mono); font-size: 8.5pt; font-weight: 600; }
.risk-item[data-tone="green"]  { border-top: 3px solid var(--c-green); }
.risk-item[data-tone="green"]  .risk-item__lvl { color: var(--c-green); }
.risk-item[data-tone="ochre"]  { border-top: 3px solid var(--c-ochre); }
.risk-item[data-tone="ochre"]  .risk-item__lvl { color: var(--c-ochre); }
.risk-item[data-tone="red"]    { border-top: 3px solid var(--c-red); background: var(--c-red-bg); }
.risk-item[data-tone="red"]    .risk-item__lvl { color: var(--c-red); }

/* 2-col and 3-col layouts */
.cols-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6mm; }
.cols-2 > *, .cols-3 > * { min-width: 0; }
.cols-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5mm; }

/* Cards grid */
.cards { display: grid; gap: 4mm; }
.cards--2 { grid-template-columns: 1fr 1fr; }
.cards--3 { grid-template-columns: 1fr 1fr 1fr; }
.card {
  padding: 5mm; border: 1px solid var(--line); background: #fff;
}
.card__label {
  font-family: var(--f-mono); font-size: 8pt; letter-spacing: .14em;
  text-transform: uppercase; color: var(--ink-soft);
  margin-bottom: 2mm;
}
.card__title {
  font-family: var(--f-serif); font-weight: 600;
  font-size: 12pt; color: var(--ink); margin: 0 0 2mm;
  line-height: 1.2;
}
.card__body { font-size: 9.5pt; line-height: 1.5; color: var(--ink); }
.card--alt { background: var(--paper-alt); }
.card--ink { background: var(--ink); color: #fff; }
.card--ink .card__label { color: rgba(255,255,255,.7); }
.card--ink .card__title { color: #fff; }
.card--ink .card__body { color: rgba(255,255,255,.9); }

/* Stat block */
.stat {
  padding: 5mm; border: 1px solid var(--line); background: var(--paper-alt);
  text-align: center;
}
.stat__n { font-family: var(--f-serif); font-weight: 700; font-size: 32pt; color: var(--accent); line-height: 1; margin: 0; }
.stat__l { font-family: var(--f-sans); font-size: 9pt; color: var(--ink-mute); text-transform: uppercase; letter-spacing: .12em; margin-top: 2mm; }

/* ===========================================================
   CODE / YAML SPEC BLOCK
=========================================================== */
.code {
  font-family: var(--f-mono); font-size: 8pt;
  line-height: 1.5;
  padding: 4mm 5mm;
  background: #0F1E3D; color: #DCE0E8;
  border-radius: 2px;
  overflow: hidden; white-space: pre-wrap; word-break: break-word;
  max-width: 100%;
}
.code--light {
  background: var(--paper-alt); color: var(--ink);
  border: 1px solid var(--line);
}
.code .c-key  { color: #7DD3FC; } /* sky */
.code .c-str  { color: #FDE68A; } /* amber-200 */
.code .c-num  { color: #C4B5FD; } /* violet-300 */
.code .c-cmt  { color: #94A3B8; font-style: italic; }
.code .c-bool { color: #86EFAC; } /* green-300 */
.code--light .c-key { color: var(--ink-soft); font-weight: 600; }
.code--light .c-str { color: var(--c-ochre); }
.code--light .c-num { color: var(--c-purple); }
.code--light .c-cmt { color: var(--ink-mute); font-style: italic; }
.code--light .c-bool { color: var(--c-green); }

/* ===========================================================
   SECTION DIVIDERS (chapter opener)
=========================================================== */
.divider {
  min-height: calc(var(--page-h) - 2*var(--page-pad-y));
  display: flex; flex-direction: column; justify-content: center;
}
.divider__pre {
  font-family: var(--f-mono); font-size: 9pt;
  letter-spacing: .3em; text-transform: uppercase;
  color: var(--ink-soft);
}
.divider__num {
  font-family: var(--f-serif); font-weight: 300;
  font-size: 110pt; color: var(--ink); line-height: .9;
  margin: 10mm 0 8mm; letter-spacing: -.04em;
}
.divider__title {
  font-family: var(--f-serif); font-weight: 700;
  font-size: 32pt; color: var(--ink); letter-spacing: -.01em;
  margin: 0 0 6mm; line-height: 1.05;
}
.divider__title em { font-style: italic; color: var(--ink-soft); }
.divider__sub {
  font-family: var(--f-serif); font-style: italic;
  font-size: 14pt; color: var(--ink-soft); max-width: 140mm;
  line-height: 1.45;
}
.divider__rule { width: 30mm; height: 2px; background: var(--ink); margin: 0 0 12mm; }

/* ===========================================================
   ROBOT TIERS (Dodatek II/R)
=========================================================== */
.tiers { display: grid; gap: 1.8mm; margin: 3mm 0; }
.tier {
  display: grid; grid-template-columns: 22mm 36mm 1fr;
  gap: 0; border: 1px solid var(--line); background: #fff;
}
.tier__badge {
  background: var(--paper-alt);
  padding: 2.8mm 3mm; text-align: center;
  border-right: 1px solid var(--line);
}
.tier__num { font-family: var(--f-serif); font-weight: 700; font-size: 14pt; color: var(--ink); line-height: 1; }
.tier__lvl { font-family: var(--f-mono); font-size: 7.5pt; letter-spacing: .14em; color: var(--ink-mute); margin-top: 1mm; }
.tier__name {
  font-family: var(--f-serif); font-weight: 600;
  font-size: 10.8pt; color: var(--ink);
  padding: 4mm 4mm; border-right: 1px solid var(--line);
  display: flex; align-items: center;
}
.tier__body {
  padding: 2.5mm 3.5mm;
  font-size: 9pt; line-height: 1.4; color: var(--ink);
}
.tier__body strong { color: var(--c-red); font-weight: 600; }

/* Needs pyramid / cards for Dodatek II/H */
.needs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3mm; margin: 4mm 0; }
.need {
  padding: 4mm 3mm; border: 1px solid var(--line);
  background: #fff; text-align: left;
}
.need__n {
  font-family: var(--f-mono); font-size: 8pt; letter-spacing: .15em;
  color: var(--ink-mute); margin-bottom: 1mm;
}
.need__name {
  font-family: var(--f-serif); font-weight: 600;
  font-size: 12pt; color: var(--ink-soft); margin: 0 0 1.5mm;
}
.need__q {
  font-style: italic; font-size: 9pt; color: var(--ink-mute); margin-bottom: 2mm;
}
.need__a { font-size: 9pt; color: var(--ink); line-height: 1.4; }

/* Finance horizons */
.horizons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3mm; margin: 4mm 0; }
.horizon {
  padding: 5mm 4mm; border: 1px solid var(--line); background: #fff;
}
.horizon__tag {
  font-family: var(--f-mono); font-size: 8pt; letter-spacing: .16em;
  color: var(--ink-soft); margin-bottom: 1mm;
}
.horizon__name {
  font-family: var(--f-serif); font-weight: 600;
  font-size: 13pt; color: var(--ink); margin: 0 0 2mm;
}
.horizon__range {
  font-family: var(--f-mono); font-size: 9pt;
  color: var(--ink-mute); margin-bottom: 3mm;
  padding-bottom: 2mm; border-bottom: 1px solid var(--line);
}
.horizon__list { margin: 0; padding: 0; list-style: none; }
.horizon__list li {
  font-size: 9pt; color: var(--ink); padding: 1mm 0;
  padding-left: 4mm; position: relative; line-height: 1.4;
}
.horizon__list li::before { content: "·"; position: absolute; left: 0; color: var(--ink-soft); font-weight: 700; }

/* ===========================================================
   PRINT
=========================================================== */
@media print {
  body { background: #fff; }
  .topbar { display: none; }
  .doc { margin: 0; padding: 0; max-width: none; }
  .page {
    margin: 0; box-shadow: none;
    width: 210mm; height: 297mm;
    page-break-after: always;
  }
  @page { size: A4; margin: 0; }
  .page__num, .page__header, .page__footer { color: #7a8397; }
}

    { type: "essay", page: 4,
      kicker: "PREFACE",
      title: "Why <em>GALDUR</em> came to be",
      body: [
        { p: "I have used and co-shaped methodologies throughout my professional life — Scrum, SAFe, Waterfall, their hybrids. What I had not done until now is write a methodology for a world where AI agents work in the team alongside humans. For a long time it felt premature; but at some point it was clear that waiting for someone else to write it made no sense." },
        { p: "Scrum and SAFe are actively responding to AI in 2026 — the Scrum Guide Expansion Pack gained a dedicated AI and Scrum guide, and Scaled Agile introduced AI-Native SAFe (as of 31 August 2026 in Early Access). In regulated industries, requirements for ongoing risk management, change control and human oversight of AI systems are being tightened. All of these approaches, however, stop at the question of who works with AI and who is accountable for it. What none of them carries through to the level of execution is <strong>the operating model of a hybrid team</strong> — a runtime contract for an agent that can migrate fifty servers overnight, rewrite a component, or generate a contract draft: what to delegate, what to approve, and what to prohibit outright. That is the space GALDUR is meant to fill — as a complementary layer, not a replacement." },
        { p: "GALDUR was therefore not born from an ambition to deliver “the correct methodology”. It was born out of what I have been doing myself for the past two years: using agents in experiments and specifically in developing the <strong>Yggaro</strong> application. Yggaro is not yet released, and that is also the honest reason why this is version 0.95 — practice at a larger scale, across clients and industries, is still to come. What I have is experience from my own development, from experiments, and from the principles that proved load-bearing within them." },
        { p: "This version (v0.95) is therefore deliberately marked as a <em>living document</em>. It contains the principles, processes and templates I use and recommend, but I expect them to change — as real deployments accumulate. The full v1.0 will ship with case studies from production projects, once there are enough of them for the conclusions to carry more than one context." },
        { p: "<strong>A note on language.</strong> This English edition mirrors the Czech original; methodology terms are kept in their original English form — <em>Intent Spec</em>, <em>Validation Gate</em>, <em>Trace Audit</em>, <em>Hard Lock</em>, <em>Drift</em>, and others — so the vocabulary matches the tools and literature used across the industry." },
        { p: "If anything in the text strikes you as imprecise or naive, write to me. That is exactly why it is v0.95." },

  // Glossary
  D.glossary = {
    intro: "GALDUR technical terminology. Italicised terms are synonyms from source methodologies — given for orientation in traditional teams.",
    terms: [
      { term: "Intent",              def: "Strategic intent — what we want to achieve and why. The primary unit of thinking in GALDUR. It is NOT a task, user story, or specification. Human-authored, not agent-generated." },
      { term: "Intent Spec",         def: "Structured contract between intent and agent. Has a Header (human-authored) and Execution Body (machine-readable). The primary working artefact of the methodology. Versioned in git." },
      { term: "Drift",               def: "Deviation of agent output from the spec. Not a defect — it is a <em>signal</em> about spec quality. Types (see ch. 08): <strong>D-SCOPE</strong> (scope_drift), <strong>D-CONSTR</strong> (constraint_breach), <strong>D-CONTEXT</strong> (context_miss), <strong>D-ESCAL</strong> (escalation_miss), <strong>D-EXTERNAL</strong> (external_failure)." },
      { term: "Drift Signal",        def: "Event emitted by the Drift Detector. Contains task_id, timestamp, type, description, severity. Routes to the Drift Dashboard and the Curator." },
      { term: "Drift Score",         def: "Weighted sum of drift events per spec. Threshold > 15 triggers a mandatory Trace Audit. Used as a leading indicator of spec quality." },
      { term: "Trace",               def: "Append-only log of every agent action against the spec. Who, when, what, with what outcome. Audit trail, not database." },
      { term: "Trace Audit",         def: "GALDUR equivalent of a retrospective — but data-first. Analyses the drift log, recalibrates governance levels, identifies failure patterns. Cadence 1–4 weeks, mandatory after a Hard Lock incident." },
      { term: "Validation Gate",     def: "Checkpoint before promoting a spec to VALIDATED. The Curator checks the outcome checklist, constraint violations, drift review. Binary decision: approve / request_revision / refine_spec / escalate." },
      { term: "Governance Level",    def: "Agent autonomy level per spec: L0 Autonomous · L1 Supervised · L2 Collaborative · L3 Manual. Defines when and how a human intervenes. The governance level is per-spec; a per-task governance_override is on the roadmap for v1.x (see 6.2)." },
      { term: "Hard Lock",           def: "Absolute prohibition — an action the agent never performs; after explicit real-time human approval a human performs it. Enforced in the Governance Engine; cannot be overridden by spec, override, or escalation. Incident = P1." },
      { term: "Hard Lock Policy Log", def: "Append-only audit registry of all Hard Lock definitions, changes, and removals. Every change requires an Amendment (L3 approval + blameless postmortem per ch. 10). Primary artefact for regulatory audit and M&A due diligence. Never overwritten or deleted — history is part of the organisation's security posture." },
      { term: "Amendment",           def: "Structured change to an existing spec. Has Trigger → Proposal → Approval → Apply → Broadcast phases. A first-class artefact, not a clerical task. Without an Amendment a spec cannot be changed." },
      { term: "Spec Lifecycle State", def: "One of 9 states: DRAFT → CRYSTALLIZED → ACTIVE → (ESCALATED ↔ SUSPENDED) → PENDING VALIDATION → VALIDATED → CLOSED, or REVERTED. Agent-initiated vs. human-initiated transitions are explicitly separated. Three typed layers sit on top of the state machine (v0.95): record correction, suspension modes, draft disposition." },
      { term: "Record correction",     def: "A Curator-initiated backward edge of the state machine (VALIDATED→ACTIVE, VALIDATED→PENDING VALIDATION, CLOSED→VALIDATED) with a mandatory reason, logged in Trace as a correction. The rate is measured as validation_correction_rate — a high value is a signal about Validation Gate evidence, not about Curator failure." },
      { term: "Parked (SUSPENDED)",  def: "A suspension mode: a conscious curator hold of a spec with a reason, without the 3-day limit of blockage mode. A parked spec stays visible in the Trace Audit." },
      { term: "Draft disposition",    def: "Marking a DRAFT as superseded (with a mandatory pointer to the successor) or rejected. The state does not change; the draft stops being offered as waiting work, history stays complete." },
      { term: "Intent Architect (IA)", def: "<em>≈ Tech Lead / Architect / Product Owner.</em> Formulates and bounds intent. Writes Intent Specs for L2/L3 tasks. Leads Trace Audits. Does not spend time on implementation." },
      { term: "Agent Curator (AC)",  def: "<em>≈ Senior Dev / SysAdmin / DBA / Domain Expert.</em> Reviews agent outputs at Validation Gates. Domain expert for their area. Has veto without justification — expert intuition is a legitimate governance mechanism." },
      { term: "Governance Steward (GS)", def: "<em>≈ Scrum Master / DevOps Lead.</em> Monitors the Drift Dashboard. Triages escalations. Facilitates Trace Audits. Does not coordinate people — coordinates the interface between people and agents." },
      { term: "Governance Engine",   def: "Runtime component: Spec Registry + Trace Store + Drift Detector + Gate Runner + Amendment Log + Hard Lock Enforcer + Dashboard + Notification Bus. Without the engine, GALDUR is a document, not a system." },
      { term: "Crystallization",     def: "Transition of a spec from DRAFT to CRYSTALLIZED. Requires: all mandatory fields, governance level defined, dependencies validated, outcome binary-verifiable. Always human-initiated." },
      { term: "Blast Radius",        def: "Scope of an action's impact — isolated file / module / system / whole organisation. An input to governance level calibration. Field <code>risk_assessment.blast_radius</code> in spec." },
      { term: "Reversibility",       def: "Ease of undoing an action: easy / partial / hard / irreversible. Together with blast_radius determines governance level. Irreversible actions are L3 candidates without exception." },
      { term: "Crew",                def: "Basic organisational unit: 1 IA + 1 Steward + 2–5 Curators + agent pool. Capable of delivering 80% of work without dependence on another Crew. Equivalent to 5–15 people." },
      { term: "Domain Intent Broadcast", def: "Quarterly structured YAML document from a Domain IA. Contains priorities, capacity, cross-domain dependencies, deprioritised items. Replaces SAFe PI Planning — 2–4 h preparation vs. 2 days." },
      { term: "Portfolio Intent Map", def: "Cross-domain visualisation of intents at the portfolio layer. Public to the whole organisation. Source of truth for strategic alignment without calendar coordination." },
      { term: "Spec Header",         def: "Human-authored part of the Intent Spec: name, intent statement, rationale, constraints, outcome criteria, governance level, risk assessment. Read by people during review, not primarily by agents. Changes require an Amendment." },
      { term: "Spec Body",           def: "Machine-readable part of the Intent Spec (Execution Body): agent_role, tools, scope, validation hooks, budget. Parsed by the Governance Engine, passed to the agent. Body changes without Header changes are allowed only via specific Amendment types." },
      { term: "Refinement",          def: "Amendment of the type \u201ctightening without intent change\u201d. Typical Validation Gate output with state <code>refine_spec</code>. Does not require re-crystallization, just delta approval from the IA. Fast loop for post-execution learning." },
      { term: "Spec Registry",       def: "Primary data store for all Intent Specs in the organisation. Versioned (git-backed), queryable, referenceable. Source of truth for \u201cwhat is running now\u201d and \u201cwhat already ran\u201d. The organisation's primary IP asset." },
      { term: "Trace Store",         def: "Append-only log of every agent action against every spec. Immutable, time-stamped, suitable for aggregation. Data source for Drift Score, Trace Audit, finance reporting, compliance audit." },
      { term: "Cross-Crew Dependency", def: "Formal dependency between specs in different Crews. Explicitly recorded in spec field <code>depends_on</code>. The Governance Engine detects circularity and blocks before ACTIVE transition. Replaces PI Planning cross-team commitments." },
      { term: "Amendment Broadcast", def: "Notification phase of the Amendment lifecycle — all subscribers of a given spec (agents, Curator, dependent Crews) receive a structured notification of the delta. Without Broadcast an Amendment can exist in the Registry but does not apply to running execution." },
      { term: "Amendment Log",       def: "Append-only record of all approved amendments per spec. Complete audit trail \u201cwho changed intent, when, why\u201d. Component of the Governance Engine. Primary artefact in incident post-mortem and compliance audit." },
      { term: "Spec Health Score",   def: "Not issued in v0.95. The five Spec Health indicators are tracked separately with their own thresholds (1+ above threshold → Trace Audit item; 3+ → Steward intervention). A composite 0–100 number returns only with an exact formula in v1.0." },

  function r_driftScoring(pd){

    const w = d.score;
    const h = d.hardLockRelation;
    var html = '';
    html += '<div class="section-kicker">CH. 08 · DRIFT · 2/3</div>';
    html += '<h2 class="h2" style="font-size:18pt;margin-top:0;">Drift Score & Drift vs. Hard Lock</h2>';

    html += '<div class="kicker-sm" style="margin-top:4mm;">WEIGHTS PER DRIFT TYPE</div>';
    html += '<table class="gtab gtab--narrow" style="font-size:8pt;"><thead><tr><th style="width:38mm;">Drift type</th><th style="width:14mm;">Weight</th><th>Reason</th></tr></thead><tbody>';

      var r = w.weights[i];
      html += '<tr><td><strong>' + r[0] + '</strong></td><td class="level-cell">' + r[1] + '</td><td class="note">' + r[2] + '</td></tr>';
    }
    html += '</tbody></table>';
    html += '<p class="note" style="font-size:7.5pt;margin-top:1mm;line-height:1.35;">' + w.note + '</p>';
    html += '<div class="kicker-sm" style="margin-top:3mm;">DRIFT vs. HARD LOCK — COMPARISON</div>';
    html += '<p class="note" style="font-size:8.2pt;line-height:1.3;">' + h.body + '</p>';
    html += '<table class="gtab" style="font-size:7.5pt;margin-top:1.5mm;"><thead><tr>';
    for (var j = 0; j < h.table[0].length; j++) html += '<th>' + h.table[0][j] + '</th>';

    for (var k = 1; k < h.table.length; k++) {

        <div class="section-head__num">ADD. III · BEFORE / AFTER</div>
        <h2 class="section-head__title">How routine work changes — concrete numbers</h2>
        <div class="section-head__rule"></div>
      </header>
      <p class="section-intro">${B.intro}</p>
      <table class="gtab" style="margin-top:4mm;">
        <thead><tr><th style="width:55mm;">Situation</th><th style="width:70mm;">Before (traditional)</th><th>With GALDUR</th></tr></thead>
        <tbody>${B.rows.map(r => `<tr><td><strong>${r[0]}</strong></td><td class="note" style="color:var(--c-red);">${r[1]}</td><td class="note" style="color:var(--c-green);">${r[2]}</td></tr>`).join('')}</tbody>
      </table>
    `);
    return p;
  }

  /* ---------- dispatch ---------- */
  const renderers = {
    cover: r_cover, colophon: r_colophon, toc: r_toc, essay: r_essay,
    summary: r_summary, 'reading-guide': r_readingGuide,
    divider: r_divider, chapter: r_chapter, principles: r_principles,
    roles: r_roles, 'intent-spec': r_intentSpec, 'intent-spec-example': r_intentSpecExample, lifecycle: r_lifecycle, 'lifecycle-ops': r_lifecycleOps,
    'governance-main': r_governanceMain, 'governance-calib': r_governanceCalib,
    validation: r_validation, drift: r_drift, 'drift-scoring': r_driftScoring, 'drift-loops': r_driftLoops,
    amendment: r_amendment, 'hard-locks': r_hardLocks, 'hard-locks-injection': r_hardLocksInjection, 'metrics-engine': r_metricsEngine,
    'intent-spec-failures': r_intentSpecFailures,
    'intent-spec-loop': r_intentSpecLoop,
    'gov-matrix-dev-a': r_govMatrixDevA, 'gov-matrix-dev-b': r_govMatrixDevB,
    'gov-matrix-ops-a': r_govMatrixOpsA, 'gov-matrix-ops-b': r_govMatrixOpsB,
    'trace-audit-template-a': r_traceAuditTemplateA,
    'trace-audit-template-b': r_traceAuditTemplateB,
    'hard-locks-domain-a': r_hardLocksDomainA,
    'hard-locks-domain-b': r_hardLocksDomainB,
    'appendix-dev': r_appendixDev, 'appendix-ops': r_appendixOps, 'appendix-refcard': r_appendixRefcard,
    'safe-cmp-1': r_safe1, 'safe-cmp-2': r_safe2, 'safe-cmp-3': r_safe3,
    'safe-cmp-4': r_safe4, 'safe-cmp-5': r_safe5, 'safe-cmp-6': r_safe6,
    robots: r_robots,
    'humans-1': r_humans1, 'humans-2': r_humans2, 'humans-3': r_humans3,
    finance: r_finance,
    'practice-1': r_practice1, 'practice-2': r_practice2,
    'practice-3': r_practice3, 'practice-4': r_practice4,
    'iv-intro': r_ivIntro, 'iv-sales': r_ivSales, 'iv-sales-ex': r_ivSalesEx,
    'iv-marketing': r_ivMarketing, 'iv-legal': r_ivLegal, 'iv-legal-2': r_ivLegal2,
    'iv-finance': r_ivFinance, 'iv-hardlocks': r_ivHardLocks,
    'iv-hybrid': r_ivHybrid, 'iv-compare': r_ivCompare,
    'legal-1': r_legal1, 'legal-2': r_legal2,
    'role-playbook-a': r_rolePlaybookA,
    'role-playbook-b': r_rolePlaybookB,
    'spec-health': r_specHealth,
    'escalation-a': r_escalationA,
    'escalation-b': r_escalationB,
    'gov-engine': r_govEngine,
    'metrics-catalog-a': r_metricsCatalogA,
    'metrics-catalog-a2': r_metricsCatalogA2,
    'metrics-catalog-b': r_metricsCatalogB,
    'team-size': r_teamSize,
    'methodology-compare-a': r_methodologyCompareA,
    'methodology-compare-b': r_methodologyCompareB,
    'migration-a': r_migrationA,
    'migration-b': r_migrationB,
    'hybrid-patterns': r_hybridPatterns,
    'faq': r_faq,
    'glossary': r_glossary,
    'finance-expansion-a': r_financeExpansionA,
    'finance-expansion-b': r_financeExpansionB,
    'careers': r_careers,
    'case-studies': r_caseStudies,
    'kitchen-full-a': r_kitchenFullA,
    'kitchen-full-b': r_kitchenFullB,
    'hybrid-firm': r_hybridFirm,
    'day-in-life-a': r_dayInLifeA,
    'day-in-life-b': r_dayInLifeB,
    'mgmt-3q': r_mgmt3Q,
    'before-after': r_beforeAfter,
    'related-work': r_relatedWork,
    'references': r_references,
    'changelog': r_changelog,
    'amendments-log': r_amendmentsLog,
  };

  // Auto-renumber pages sequentially so that inserting/removing pages
  // in the D.pages registry doesn't require manual renumbering.
  D.pages.forEach((pd, i) => { pd.page = i + 1; });

  // Sync the Table of Contents with the renumbered pages. We match each
  // TOC entry to a page in D.pages and copy its resolved page number over.
  //   · Front/back matter entries match by page type
  //   · Chapter / addendum entries match by divider `num`
  (function syncToc(){
    const findType = (t) => D.pages.find(p => p.type === t);
    const findDivider = (n) => D.pages.find(p => p.type === 'divider' && (p.num === n || ('II/' + p.num) === n));

    // Chapters 09–12 don't have dividers — they're direct page types.
    // Map chapter number → page type so TOC resolves their page numbers.
    const chapterTypeByNum = {
      '09': 'amendment',
      '10': 'hard-locks',
      '11': 'metrics-engine',
      '12': 'gov-engine',
    };

    const byName = {
      'Table of Contents':                                                 findType('toc'),
      'Author\u2019s Preface':                                             findType('essay'),
      "Author's Preface":                                                  findType('essay'),
      'Executive Summary':                                                 findType('summary'),
      'How to Read This Document':                                         findType('reading-guide'),
      'FAQ — questions that always come up':                               findType('faq'),
      'Glossary — core terms':                                             findType('glossary'),
      'Related Work — GALDUR in the context of existing methodologies':    findType('related-work'),
      'References & Further Reading':                                      findType('references'),
      'Changelog — methodology evolution v0.1 → v0.95':                     findType('changelog'),
      'Amendments — process & change log':                                 findType('amendments-log'),
      'Legal Information & Licensing':                                     findType('legal-1'),
    };

    D.toc.forEach(sec => sec.items.forEach(item => {
      // Clear any stale hard-coded page — we're re-resolving.
      item.page = undefined;
      // Chapters and addenda use the `num` column (e.g. "01", "I", "IV").
      if (item.num) {
        const d = findDivider(item.num);
        if (d) { item.page = d.page; return; }
        // Chapter without divider — fall back to the page type mapping.
        const tp = chapterTypeByNum[item.num];
        if (tp) {
          const pg = findType(tp);
          if (pg) item.page = pg.page;
        }
        return;
      }
      // Front / back matter entries use the name.
      const match = byName[item.name];
      if (match) item.page = match.page;
    }));
  })();

  // Page cross-references in the text ({{p:TYPE}}) are resolved after numbering —
  // hand-written page numbers went stale after every page insertion (7 Sep 2026).
  const resolvePageRefs = (html) => html.replace(/\{\{p:([a-z0-9-]+)\}\}/g, (m, t) => {
    const d = D.pages.find(x => x.type === t); return d ? d.page : '?';
  });

  D.pages.forEach(pd => {
    const fn = renderers[pd.type];
    if (fn) {
      try {
        const pg = fn(pd);
        if (pg.innerHTML.includes('{{p:')) pg.innerHTML = resolvePageRefs(pg.innerHTML);
        doc.appendChild(pg);
      }
      catch(e){
        console.error('Render error on page', pd.page, pd.type, e);
        const err = pageShell(pd.page);
        err.insertAdjacentHTML('beforeend', `<div class="callout callout--red"><div class="callout__label">RENDER ERROR</div><div class="callout__body">Type: ${pd.type}<br>${e.message}</div></div>`);
        doc.appendChild(err);
      }
    } else {
      const miss = pageShell(pd.page);
      miss.insertAdjacentHTML('beforeend', `<div class="callout callout--ochre"><div class="callout__label">MISSING RENDERER</div><div class="callout__body">type: <code>${pd.type}</code></div></div>`);
      doc.appendChild(miss);
    }
  });

  /* ---------- Auto-fit: detect overflow and gently shrink page content ----------
     We measure each page after render. If content height exceeds the page's
     available area, we wrap inner content in a fit-box and apply a
     transform: scale() so it fits. This prevents print/PDF page-number
     gaps caused by content overflowing into a phantom next page. */
  const runAutoFit = () => {
      const PAGE_H_MM = 297;
      const PAGE_PAD_TOP_MM = 22;   // matches --page-pad-y default range
      const PAGE_PAD_BOT_MM = 22;
      // Convert mm -> px using a probe.
      const probe = document.createElement('div');
      probe.style.cssText = 'position:absolute;left:-9999px;top:0;width:100mm;height:100mm;';
      document.body.appendChild(probe);
      const pxPerMm = probe.getBoundingClientRect().width / 100;
      probe.remove();
      const PAGE_H_PX = PAGE_H_MM * pxPerMm;

      const pages = doc.querySelectorAll('.page');
      pages.forEach((page, idx) => {
        // Skip cover (no header/num) — it's usually fine.
        const num = page.querySelector('.page__num');
        if (!num) return;
        // Measure: how much do children extend beyond the page box?
        const pageRect = page.getBoundingClientRect();
        // Compute the bottom edge of the LAST non-fixed content child
        // (excluding .page__header, .page__num which are absolute).
        let maxBottom = 0, minTop = Infinity;
        const existingFit = page.querySelector(':scope > .page__fit');
        page.childNodes.forEach(n => {
          if (n.nodeType !== 1) return;
          if (n.classList && (n.classList.contains('page__header') || n.classList.contains('page__num') || n.classList.contains('page__footer'))) return;
          const r = n.getBoundingClientRect();
          if (r.bottom > maxBottom) maxBottom = r.bottom;
          if (r.height && r.top < minTop) minTop = r.top;
        });
        if (!maxBottom) return;
        // Available bottom edge = top of the page number minus 2 px (7 Sep 2026: the old
        // "~14 mm" estimate let 4–11 px of ink run into the number zone on tight pages).
        // Media-independent limit: on screen .page only has min-height and grows with its
        // content, so the number never "collides" there — but print fixes the page at 297 mm.
        // Chrome prints with the screen layout's scale decisions, so measure against A4.
        const numH = num.getBoundingClientRect().height || 12;
        const bottomLimit = pageRect.top + PAGE_H_PX - 10 * pxPerMm - numH - 24; // number sits 10 mm from bottom; 24 px ≈ 6 mm clear zone (screen vs print layout differ by a few pt)
        const overflow = maxBottom - bottomLimit;
        if (overflow > 0) {
          // Compute scale: shrink content height so it fits.
          // Real top of the content (the padding constant under-estimated it → scale too large → the
          // scaled content still ended 4–7 pt above the page number instead of the 6 mm zone).
          const contentTop = isFinite(minTop) ? minTop : pageRect.top + (page.classList.contains('page--tight') ? 14 : 20) * pxPerMm;
          const contentH = maxBottom - contentTop;
          const availH = bottomLimit - contentTop;
          if (existingFit) {
            // Re-run (fonts finished loading after the first pass): tighten the existing scale
            // instead of wrapping again — nested wrappers would compound and clip.
            const prev = parseFloat(existingFit.dataset.scale || '1');
            const scale2 = Math.max(0.78, prev * (availH / contentH));
            existingFit.dataset.scale = String(scale2);
            existingFit.style.cssText = `transform: scale(${scale2}); transform-origin: top left; width: ${100/scale2}%;`;
            return;
          }
          const scale = Math.max(0.78, availH / contentH);
          // Wrap movable children into a fit-box.
          const fit = document.createElement('div');
          fit.dataset.scale = String(scale);
          fit.className = 'page__fit';
          fit.style.cssText = `transform: scale(${scale}); transform-origin: top left; width: ${100/scale}%;`;
          const movable = [];
          page.childNodes.forEach(n => {
            if (n.nodeType !== 1) return;
            if (n.classList && (n.classList.contains('page__header') || n.classList.contains('page__num') || n.classList.contains('page__footer'))) return;
            movable.push(n);
          });
          movable.forEach(n => fit.appendChild(n));
          page.appendChild(fit);
        }
      });
  };
  // 7 Sep 2026: headless print-to-PDF never fires requestAnimationFrame, so the auto-fit
  // silently did not run in the PDF (content ran into the page number on ~10 pages while the
  // on-screen check passed). Run it on a timer after fonts are ready — timers do advance
  // under the print virtual clock; rAF is kept only as an extra trigger for screens.
  // Several passes: fonts.ready can resolve before the web fonts are actually applied, and a
  // pass with fallback metrics under-measures. The fit is idempotent (re-scales, never nests).
  const schedule = () => { setTimeout(runAutoFit, 0); setTimeout(runAutoFit, 3000); setTimeout(runAutoFit, 7000); requestAnimationFrame(() => requestAnimationFrame(runAutoFit)); };
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(schedule);
    setTimeout(runAutoFit, 9000); // fail-safe if fonts.ready never resolves
  } else {
    schedule();
  }
})();
