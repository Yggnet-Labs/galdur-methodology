/* GALDUR Methodology — Variant A · Klasika
   Finální stylesheet pro 59 stránkovou metodiku.
   Typografie: Source Serif 4 (serif) + Inter Tight (sans) + JetBrains Mono (mono)
   Primární: GALDUR modrá #1E3A8A */

:root {
  --page-w: 210mm;
  --page-h: 297mm;
  --page-pad-x: 22mm;
  --page-pad-y: 20mm;

  --ink:       #0F1E3D;
  --ink-soft:  #1E3A8A;
  --ink-mute:  #475569;
  --ink-faint: #94a3b8;
  --line:      #DCE0E8;
  --line-2:    #B7BECC;
  --paper:     #FFFFFF;
  --paper-alt: #F5F7FB;
  --paper-2:   #EEF1F7;
  --accent:    #1E3A8A;

  --c-green:  #2F855A; --c-green-bg:  #E6F4EB;
  --c-ochre:  #B7791F; --c-ochre-bg:  #FBF4E0;
  --c-purple: #6B3AA0; --c-purple-bg: #EFE8F7;
  --c-red:    #B91C1C; --c-red-bg:    #FBEAEA;
  --c-teal:   #0E7490; --c-teal-bg:   #E0F2F7;

  --f-serif: "Source Serif 4", "Source Serif Pro", Georgia, serif;
  --f-sans:  "Inter Tight", "Inter", system-ui, sans-serif;
  --f-mono:  "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: #e9e9ed;
  font-family: var(--f-sans);
  color: var(--ink);
  font-size: 10.5pt;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-feature-settings: "kern" 1, "liga" 0, "dlig" 0, "calt" 0;
}

.doc {
  max-width: calc(var(--page-w) + 20mm);
  margin: 0 auto;
  padding: 16mm 0 24mm;
}

/* ---- Top bar (screen only) ---- */
.topbar {
  position: sticky; top: 0; z-index: 100;
  display: flex; gap: 10px; justify-content: center; align-items: center;
  padding: 8px 12px; background: rgba(255,255,255,.94);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid #d5d5da;
  font: 500 11.5px/1 var(--f-sans);
  letter-spacing: .04em;
}
.topbar__title { font-family: var(--f-serif); font-weight: 600; color: var(--ink); font-size: 14px; letter-spacing: 0; }
.topbar__meta { color: #666; font-weight: 400; }
.topbar a {
  text-decoration: none; color: var(--ink); border: 1px solid var(--line-2);
  padding: 5px 10px; border-radius: 999px; font-size: 11px;
  letter-spacing: .06em; text-transform: uppercase;
}
.topbar a:hover { background: var(--ink); color: #fff; border-color: var(--ink); }

/* ---- Page frame ---- */
.page {
  width: var(--page-w);
  min-height: var(--page-h);
  margin: 10mm auto;
  background: var(--paper);
  padding: var(--page-pad-y) var(--page-pad-x);
  box-shadow: 0 2px 8px rgba(0,0,0,.08), 0 30px 60px -20px rgba(0,0,0,.12);
  position: relative;
  page-break-after: always;
  overflow: hidden;
  color: var(--ink);
}
.page--tight { padding-top: 14mm; padding-bottom: 14mm; }
.url { white-space: nowrap; hyphens: none; } /* URL adresy: zlom jen za lomítkem (<wbr>), nikdy ve spojovníku */
.page__num {
  position: absolute;
  bottom: 10mm; left: 0; right: 0;
  text-align: center;
  font-family: var(--f-sans); font-weight: 500;
  font-size: 9pt; color: var(--ink-faint);
  letter-spacing: .06em;
}
.page__header {
  position: absolute;
  top: 10mm; left: var(--page-pad-x); right: var(--page-pad-x);
  font-family: var(--f-sans); font-weight: 500;
  font-size: 8.5pt; color: var(--ink-faint);
  letter-spacing: .14em; text-transform: uppercase;
  display: flex; justify-content: space-between; align-items: center;
}
.page__header .l { color: var(--ink-mute); }
.page__header .r { }
.page__footer {
  position: absolute;
  bottom: 14mm; left: var(--page-pad-x); right: var(--page-pad-x);
  font-family: var(--f-sans); font-size: 8pt;
  color: var(--ink-faint); letter-spacing: .04em;
  display: flex; justify-content: space-between;
}

/* ===========================================================
   COVER (page 1)
=========================================================== */
.cover { display: flex; flex-direction: column; min-height: calc(var(--page-h) - 2*var(--page-pad-y)); }
.cover__kicker {
  align-self: center;
  font-family: var(--f-sans); font-weight: 500;
  font-size: 9.5px; letter-spacing: .32em; color: var(--ink);
  text-transform: uppercase;
  padding: 8px 14px; border: 1px solid var(--ink);
  margin-top: 18mm;
}
.cover__logo {
  font-family: var(--f-serif); font-weight: 700;
  font-size: 84pt; letter-spacing: -.02em;
  color: var(--ink); text-align: center;
  margin: 26mm 0 12mm; line-height: 1;
}
.cover__etym {
  font-family: var(--f-sans);
  font-size: 10pt; color: var(--ink-mute); font-weight: 400;
  text-align: center; max-width: 140mm; margin: 0 auto;
  line-height: 1.6;
}
.cover__etym em { font-style: italic; color: var(--ink); font-weight: 600; }
.cover__sub {
  font-family: var(--f-serif); font-style: italic;
  font-size: 15pt; text-align: center;
  color: var(--ink-soft); margin: 10mm auto 0;
  max-width: 150mm; line-height: 1.35;
}
.cover__foot {
  font-family: var(--f-sans); font-weight: 500;
  letter-spacing: .02em;
  font-size: 8pt; color: var(--ink-mute);
  text-align: center; margin-top: 8mm;
}

/* Ecosystem */
.eco {
  margin-top: 10mm;
  padding: 10mm 8mm;
  border: 1px solid var(--line);
  border-radius: 2px;
  background: var(--paper-alt);
}
.eco__title {
  font-family: var(--f-mono); font-size: 8.5pt;
  letter-spacing: .22em; text-align: center;
  color: var(--ink); margin-bottom: 6mm;
}
.eco__tagline {
  margin-top: 8mm;
  padding: 4mm 6mm;
  border-left: 3px solid var(--accent);
  background: #fff;
  font-family: var(--f-serif); font-style: italic;
  font-size: 11pt; color: var(--ink); line-height: 1.5;
}
.eco__tagline p { margin: 0 0 2mm; }
.eco__tagline p:last-child { margin: 0; }

/* ===========================================================
   SECTION / PAGE PRIMITIVES
=========================================================== */
.section-kicker {
  font-family: var(--f-sans); font-weight: 500;
  font-size: 9pt; text-transform: uppercase;
  letter-spacing: .24em; color: var(--ink);
  padding-bottom: 4mm; border-bottom: 1.5px solid var(--ink);
  margin-bottom: 8mm;
}
.section-head { margin: 0 0 5mm; }
.section-head__num {
  font-family: var(--f-mono); font-size: 9pt;
  letter-spacing: .2em; color: var(--ink-mute);
}
.section-head__title {
  font-family: var(--f-serif); font-weight: 700;
  font-size: 26pt; line-height: 1.05;
  color: var(--ink); margin: 3mm 0 4mm;
  letter-spacing: -.01em;
}
.section-head__title em {
  font-style: italic; color: var(--ink-soft); font-weight: 700;
}
.section-head__rule { height: 1px; background: var(--ink); }
.section-intro {
  font-size: 10.5pt; line-height: 1.55;
  color: var(--ink); margin: 4mm 0 5mm;
  max-width: 155mm;
  text-wrap: pretty;
}

/* Subheads inside a section */
.h2 {
  font-family: var(--f-serif); font-weight: 700;
  font-size: 14.5pt; line-height: 1.15; color: var(--ink);
  margin: 5mm 0 2.5mm; letter-spacing: -.005em;
}
.h2 em { font-style: italic; color: var(--ink-soft); font-weight: 700; }
.h3 {
  font-family: var(--f-serif); font-weight: 600;
  font-size: 12.5pt; color: var(--ink);
  margin: 4mm 0 2mm;
}
.kicker-sm {
  font-family: var(--f-mono);
  font-size: 8pt; letter-spacing: .22em;
  text-transform: uppercase; color: var(--ink-mute);
  margin-bottom: 2mm;
}

/* Body prose */
.prose p { margin: 0 0 2.5mm; text-wrap: pretty; font-size: 10pt; line-height: 1.55; }
.prose p + p { margin-top: 0; }
.prose strong { color: var(--ink); font-weight: 600; }
.prose em { font-style: italic; }
.prose ul, .prose ol { margin: 2mm 0 4mm 6mm; padding: 0; }
.prose li { margin-bottom: 1.5mm; line-height: 1.55; }
.prose ul { list-style: none; padding-left: 0; margin-left: 0; }
.prose ul > li {
  position: relative; padding-left: 6mm;
}
.prose ul > li::before {
  content: "—"; position: absolute; left: 0; color: var(--ink-soft); font-weight: 600;
}
.prose ol { list-style: decimal; margin-left: 6mm; }
.prose ol li::marker { color: var(--ink-soft); font-weight: 600; font-family: var(--f-mono); font-size: 9pt; }

/* Pull quote / principle block */
.pullquote {
  border-left: 3px solid var(--accent);
  background: var(--paper-alt);
  padding: 5mm 6mm;
  font-family: var(--f-serif); font-style: italic;
  font-size: 12pt; line-height: 1.5;
  color: var(--ink); margin: 4mm 0;
}
.pullquote p { margin: 0 0 2mm; }
.pullquote p:last-child { margin: 0; }
.pullquote--strong {
  background: var(--ink);
  color: #fff; border-color: #fff;
}
.pullquote--strong em { color: #fff; opacity: .9; }

/* Callout box */
.callout {
  padding: 4mm 5mm;
  margin: 3mm 0;
  background: var(--paper-alt);
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
}
.callout__label {
  font-family: var(--f-mono); font-size: 8pt; letter-spacing: .16em;
  text-transform: uppercase; color: var(--ink-soft);
  margin-bottom: 2mm;
}
.callout__body { font-size: 10pt; line-height: 1.55; }
.callout--ochre { border-left-color: var(--c-ochre); background: var(--c-ochre-bg); }
.callout--ochre .callout__label { color: var(--c-ochre); }
.callout--green { border-left-color: var(--c-green); background: var(--c-green-bg); }
.callout--green .callout__label { color: var(--c-green); }
.callout--red   { border-left-color: var(--c-red);   background: var(--c-red-bg); }
.callout--red   .callout__label { color: var(--c-red); }
.callout--purple{ border-left-color: var(--c-purple); background: var(--c-purple-bg); }
.callout--purple .callout__label { color: var(--c-purple); }

/* Definition list / key-value grid */
.kv {
  display: grid; grid-template-columns: 44mm 1fr;
  gap: 1.5mm 5mm; margin: 2mm 0 3mm;
}
.kv dt {
  font-family: var(--f-sans); font-weight: 600;
  font-size: 9.5pt; color: var(--ink-soft);
  text-transform: uppercase; letter-spacing: .08em;
  padding-top: .3mm;
}
.kv dd {
  margin: 0; font-size: 10pt; line-height: 1.55;
}

/* ===========================================================
   TOC
=========================================================== */
.toc__title {
  font-family: var(--f-serif); font-weight: 700;
  font-size: 22pt; color: var(--ink);
  margin: 0 0 1.5mm; letter-spacing: -.01em;
}
.toc__subtitle {
  font-family: var(--f-serif); font-style: italic;
  font-size: 10pt; color: var(--ink-soft);
  margin: 0 0 3mm;
}
.toc__section {
  font-family: var(--f-mono); font-size: 7pt; letter-spacing: .2em;
  text-transform: uppercase; color: var(--ink-mute);
  margin: 2.5mm 0 1mm;
  padding-bottom: 0.6mm; border-bottom: 1px solid var(--line);
}
.toc__item {
  display: grid; grid-template-columns: 9mm 1fr auto;
  gap: 2.5mm; align-items: baseline;
  padding: 0.4mm 0;
  border-bottom: 1px dotted var(--line);
  font-size: 8.4pt;
}
.toc__num {
  font-family: var(--f-mono); font-weight: 500;
  font-size: 8pt; color: var(--ink-soft);
}
.toc__name { color: var(--ink); }
.toc__name em { font-style: italic; color: var(--ink-mute); font-weight: 400; }
.toc__page {
  font-family: var(--f-mono); font-size: 8pt;
  color: var(--ink-mute);
}

/* ===========================================================
   GOVERNANCE LEVELS
=========================================================== */
.levels { display: grid; gap: 3mm; }
.level {
  display: grid; grid-template-columns: 30mm 1fr;
  border: 1px solid var(--line);
  border-left-width: 4px;
  border-radius: 2px;
  overflow: hidden;
}
.level[data-tone="green"]  { border-left-color: var(--c-green); }
.level[data-tone="ochre"]  { border-left-color: var(--c-ochre); }
.level[data-tone="purple"] { border-left-color: var(--c-purple); }
.level[data-tone="red"]    { border-left-color: var(--c-red); }
.level__badge {
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  padding: 6mm 2mm;
  background: var(--paper-alt);
  border-right: 1px solid var(--line);
}
.level__code { font-family: var(--f-serif); font-weight: 700; font-size: 26pt; line-height: 1; color: var(--ink); }
.level__name { font-family: var(--f-mono); font-size: 7.5pt; letter-spacing: .14em; margin-top: 2mm; color: var(--ink-mute); }
.level__body { padding: 5mm 6mm; }
.level__caption { font-family: var(--f-serif); font-weight: 600; font-size: 12pt; color: var(--ink); margin-bottom: 1mm; }
.level__one   { font-size: 10.5pt; color: var(--ink); margin: 0 0 2mm; }
.level__touch { font-size: 9.5pt; color: var(--ink-mute); margin: 0 0 2mm; }
.level__ex    { font-family: var(--f-mono); font-size: 8.5pt; color: var(--ink-mute); letter-spacing: .01em; }
.level__ex::before {
  content: "Příklady: "; text-transform: uppercase; letter-spacing: .1em;
  font-size: 7.5pt; color: var(--ink); margin-right: 2mm;
}

/* Cascade */
.cascade {
  margin-top: 4mm; border: 1px solid var(--line);
  padding: 4mm 5mm; background: var(--paper-alt);
}
.cascade__title {
  font-family: var(--f-mono); font-size: 8pt;
  letter-spacing: .22em; text-align: center; color: var(--ink);
  margin-bottom: 4mm;
}
.cascade__trigger {
  padding: 2mm 4mm; border: 1.5px solid var(--c-red);
  background: #fff; text-align: center;
  font-weight: 600; color: var(--c-red);
  font-size: 9.5pt; margin-bottom: 4mm;
}
.cascade__steps { display: grid; gap: 2mm; }
.cascade__step {
  display: grid; grid-template-columns: 9mm 1fr; gap: 4mm;
  align-items: start;
  padding: 2.2mm 3.5mm; border: 1px solid var(--line); background: #fff;
}
.cascade__n { font-family: var(--f-serif); font-size: 15pt; color: var(--accent); line-height: 1; padding-top: .5mm; }
.cascade__title-sm { font-family: var(--f-mono); font-size: 8pt; letter-spacing: .16em; color: var(--ink); margin-bottom: .8mm; }
.cascade__body { font-size: 9pt; color: var(--ink); line-height:1.4; }
.cascade__exit { font-family: var(--f-mono); font-size: 8pt; color: var(--c-green); margin-top: 1mm; letter-spacing: .08em; }
.cascade__options { display: flex; gap: 4mm; flex-wrap: wrap; margin-top: 2mm; }
.cascade__opt {
  border: 1px solid var(--line); padding: 2mm 3mm; background: var(--paper-alt);
}
.cascade__opt-l { font-family: var(--f-mono); font-size: 8pt; color: var(--ink); }
.cascade__opt-s { font-size: 8.5pt; color: var(--ink-mute); }

/* Calibration */
.calib { margin-top: 5mm; }

.cascade-svg {
  margin: 0 0 5mm;
  padding: 3mm 4mm 4mm;
  background: var(--paper-alt);
  border: 1px solid var(--line);
}
.cascade-svg__title {
  font-family: var(--f-mono);
  font-size: 8pt; letter-spacing: .22em;
  text-align: center; color: var(--ink);
  margin-bottom: 2mm;
}
.cascade-svg svg {
  width: 100%; height: auto; display: block;
}
.calib__title {
  font-family: var(--f-serif); font-weight: 700; font-size: 13pt;
  color: var(--ink); margin: 0 0 2mm;
}
.calib__intro { font-size: 9.5pt; color: var(--ink); margin: 0 0 3mm; line-height: 1.45; }
.calib__q { margin: 0 0 2.5mm; padding-left: 3.5mm; border-left: 2px solid var(--accent); }
.calib__qh { font-family: var(--f-mono); font-size: 8pt; letter-spacing: .12em; color: var(--ink); margin-bottom: 1mm; }
.calib__a { margin: 0; padding-left: 3.5mm; }
.calib__a li { font-size: 9.3pt; color: var(--ink); margin-bottom: .5mm; line-height: 1.4; }
.calib__tip {
  margin-top: 3mm; padding: 2.8mm 4mm;
  background: var(--c-ochre-bg);
  border-left: 3px solid var(--c-ochre);
  font-size: 9.3pt; color: var(--ink);
  font-style: italic;
  line-height: 1.45;
}
.calib--compact { margin-top: 3mm; }
.calib--compact .calib__title { font-size: 11.5pt; margin-bottom: 1.5mm; }
.calib--compact .calib__intro { font-size: 8.8pt; margin-bottom: 2mm; line-height: 1.4; }
.calib--compact .calib__q { margin-bottom: 1.5mm; padding-left: 3mm; }
.calib--compact .calib__qh { font-size: 7.5pt; margin-bottom: .5mm; }
.calib--compact .calib__a li { font-size: 8.5pt; margin-bottom: .3mm; line-height: 1.35; }
.calib--compact .calib__tip { margin-top: 2mm; padding: 2mm 3mm; font-size: 8.5pt; line-height: 1.4; }

/* ===========================================================
   TABLES
=========================================================== */
table.gtab {
  width: 100%; border-collapse: collapse;
  font-size: 9.5pt; margin: 3mm 0;
  border: 1px solid var(--line);
}
.gtab thead th {
  font-family: var(--f-sans); font-weight: 600;
  font-size: 8.5pt; letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--ink-soft);
  text-align: left;
  padding: 3mm 4mm;
  background: var(--paper-alt);
  border-bottom: 1.5px solid var(--ink);
}
.gtab tbody td {
  padding: 2.5mm 4mm;
  border-bottom: 1px solid var(--line);
  vertical-align: top;
  line-height: 1.5;
}
.gtab tbody tr:last-child td { border-bottom: 0; }
.gtab tbody tr:nth-child(even) td { background: var(--paper-alt); }
.gtab td.level-cell {
  font-family: var(--f-mono); font-weight: 500;
  font-size: 9pt; color: var(--ink-soft);
  white-space: nowrap;
}
.gtab td.level-cell[data-tone="green"]  { color: var(--c-green); }
.gtab td.level-cell[data-tone="ochre"]  { color: var(--c-ochre); }
.gtab td.level-cell[data-tone="purple"] { color: var(--c-purple); }
.gtab td.level-cell[data-tone="red"]    { color: var(--c-red); font-weight: 700; }
.gtab .note { color: var(--ink-mute); font-size: 9pt; }
.gtab caption {
  caption-side: top; text-align: left;
  font-family: var(--f-mono); font-size: 8pt; letter-spacing: .18em;
  text-transform: uppercase; color: var(--ink-mute);
  padding-bottom: 2mm;
}

/* Narrow table variant */
.gtab--narrow td, .gtab--narrow th { padding: 1.6mm 2.4mm; font-size: 8.6pt; line-height: 1.42; }

/* ===========================================================
   DIAGRAMS
=========================================================== */
.diagram {
  margin: 4mm 0;
  padding: 5mm 6mm;
  background: var(--paper-alt);
  border: 1px solid var(--line);
}
.diagram__title {
  font-family: var(--f-mono); font-size: 8.5pt;
  letter-spacing: .22em; text-align: center;
  color: var(--ink); margin-bottom: 4mm;
  text-transform: uppercase;
}
.diagram__caption {
  font-size: 9pt; color: var(--ink-mute);
  margin-top: 3mm; text-align: center; font-style: italic;
}

/* Horizontal flow — arrow chain */
.flow {
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
  gap: 0; align-items: stretch;
}
.flow__step {
  padding: 4mm 3mm; background: #fff;
  border: 1px solid var(--line);
  position: relative;
  text-align: center;
  border-right: 0;
}
.flow__step:last-child { border-right: 1px solid var(--line); }
.flow__step + .flow__step::before {
  content: "→"; position: absolute; left: -3mm; top: 50%;
  transform: translateY(-50%);
  background: var(--paper-alt);
  color: var(--ink-soft); font-weight: 700;
  padding: 0 1mm;
  font-size: 12pt;
}
.flow__code {
  font-family: var(--f-mono); font-size: 8pt;
  letter-spacing: .1em; color: var(--accent);
  margin-bottom: 1mm;
}
.flow__label {
  font-family: var(--f-serif); font-weight: 600;
  font-size: 10pt; color: var(--ink);
  line-height: 1.25;
}
.flow__sub {
  font-size: 8pt; color: var(--ink-mute);
  margin-top: 1mm;
}

/* Risk ladder (low → medium → high with tone) */
.risk-ladder {
  display: grid; grid-template-columns: repeat(7, 1fr);
  gap: 2mm; margin: 4mm 0;
}
.risk-ladder__bar {
  grid-column: 1 / -1;
  display: grid; grid-template-columns: 2fr 2fr 3fr;
  font-family: var(--f-mono); font-size: 7.5pt; letter-spacing: .2em;
  text-transform: uppercase; color: var(--ink-mute);
  margin-bottom: 1mm;
}
.risk-ladder__bar span { padding: 1mm 2mm; text-align: center; }
.risk-ladder__bar span:nth-child(1) { background: var(--c-green-bg); color: var(--c-green); }
.risk-ladder__bar span:nth-child(2) { background: var(--c-ochre-bg); color: var(--c-ochre); }
.risk-ladder__bar span:nth-child(3) { background: var(--c-red-bg); color: var(--c-red); }
.risk-item {
  padding: 3mm 2mm; background: #fff;
  border: 1px solid var(--line); text-align: center;
}
.risk-item__task { font-size: 8.5pt; color: var(--ink); line-height: 1.25; margin-bottom: 1mm; text-wrap: balance; }
.risk-item__lvl  { font-family: var(--f-mono); font-size: 8.5pt; font-weight: 600; }
.risk-item[data-tone="green"]  { border-top: 3px solid var(--c-green); }
.risk-item[data-tone="green"]  .risk-item__lvl { color: var(--c-green); }
.risk-item[data-tone="ochre"]  { border-top: 3px solid var(--c-ochre); }
.risk-item[data-tone="ochre"]  .risk-item__lvl { color: var(--c-ochre); }
.risk-item[data-tone="red"]    { border-top: 3px solid var(--c-red); background: var(--c-red-bg); }
.risk-item[data-tone="red"]    .risk-item__lvl { color: var(--c-red); }

/* 2-col and 3-col layouts */
.cols-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6mm; }
.cols-2 > *, .cols-3 > * { min-width: 0; }
.cols-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5mm; }

/* Cards grid */
.cards { display: grid; gap: 4mm; }
.cards--2 { grid-template-columns: 1fr 1fr; }
.cards--3 { grid-template-columns: 1fr 1fr 1fr; }
.card {
  padding: 5mm; border: 1px solid var(--line); background: #fff;
}
.card__label {
  font-family: var(--f-mono); font-size: 8pt; letter-spacing: .14em;
  text-transform: uppercase; color: var(--ink-soft);
  margin-bottom: 2mm;
}
.card__title {
  font-family: var(--f-serif); font-weight: 600;
  font-size: 12pt; color: var(--ink); margin: 0 0 2mm;
  line-height: 1.2;
}
.card__body { font-size: 9.5pt; line-height: 1.5; color: var(--ink); }
.card--alt { background: var(--paper-alt); }
.card--ink { background: var(--ink); color: #fff; }
.card--ink .card__label { color: rgba(255,255,255,.7); }
.card--ink .card__title { color: #fff; }
.card--ink .card__body { color: rgba(255,255,255,.9); }

/* Stat block */
.stat {
  padding: 5mm; border: 1px solid var(--line); background: var(--paper-alt);
  text-align: center;
}
.stat__n { font-family: var(--f-serif); font-weight: 700; font-size: 32pt; color: var(--accent); line-height: 1; margin: 0; }
.stat__l { font-family: var(--f-sans); font-size: 9pt; color: var(--ink-mute); text-transform: uppercase; letter-spacing: .12em; margin-top: 2mm; }

/* ===========================================================
   CODE / YAML SPEC BLOCK
=========================================================== */
.code {
  font-family: var(--f-mono); font-size: 8pt;
  line-height: 1.5;
  padding: 4mm 5mm;
  background: #0F1E3D; color: #DCE0E8;
  border-radius: 2px;
  overflow: hidden; white-space: pre-wrap; word-break: break-word;
  max-width: 100%;
}
.code--light {
  background: var(--paper-alt); color: var(--ink);
  border: 1px solid var(--line);
}
.code .c-key  { color: #7DD3FC; } /* sky */
.code .c-str  { color: #FDE68A; } /* amber-200 */
.code .c-num  { color: #C4B5FD; } /* violet-300 */
.code .c-cmt  { color: #94A3B8; font-style: italic; }
.code .c-bool { color: #86EFAC; } /* green-300 */
.code--light .c-key { color: var(--ink-soft); font-weight: 600; }
.code--light .c-str { color: var(--c-ochre); }
.code--light .c-num { color: var(--c-purple); }
.code--light .c-cmt { color: var(--ink-mute); font-style: italic; }
.code--light .c-bool { color: var(--c-green); }

/* ===========================================================
   SECTION DIVIDERS (chapter opener)
=========================================================== */
.divider {
  min-height: calc(var(--page-h) - 2*var(--page-pad-y));
  display: flex; flex-direction: column; justify-content: center;
}
.divider__pre {
  font-family: var(--f-mono); font-size: 9pt;
  letter-spacing: .3em; text-transform: uppercase;
  color: var(--ink-soft);
}
.divider__num {
  font-family: var(--f-serif); font-weight: 300;
  font-size: 110pt; color: var(--ink); line-height: .9;
  margin: 10mm 0 8mm; letter-spacing: -.04em;
}
.divider__title {
  font-family: var(--f-serif); font-weight: 700;
  font-size: 32pt; color: var(--ink); letter-spacing: -.01em;
  margin: 0 0 6mm; line-height: 1.05;
}
.divider__title em { font-style: italic; color: var(--ink-soft); }
.divider__sub {
  font-family: var(--f-serif); font-style: italic;
  font-size: 14pt; color: var(--ink-soft); max-width: 140mm;
  line-height: 1.45;
}
.divider__rule { width: 30mm; height: 2px; background: var(--ink); margin: 0 0 12mm; }

/* ===========================================================
   ROBOT TIERS (Dodatek II/R)
=========================================================== */
.tiers { display: grid; gap: 1.8mm; margin: 3mm 0; }
.tier {
  display: grid; grid-template-columns: 22mm 36mm 1fr;
  gap: 0; border: 1px solid var(--line); background: #fff;
}
.tier__badge {
  background: var(--paper-alt);
  padding: 2.8mm 3mm; text-align: center;
  border-right: 1px solid var(--line);
}
.tier__num { font-family: var(--f-serif); font-weight: 700; font-size: 14pt; color: var(--ink); line-height: 1; }
.tier__lvl { font-family: var(--f-mono); font-size: 7.5pt; letter-spacing: .14em; color: var(--ink-mute); margin-top: 1mm; }
.tier__name {
  font-family: var(--f-serif); font-weight: 600;
  font-size: 10.8pt; color: var(--ink);
  padding: 4mm 4mm; border-right: 1px solid var(--line);
  display: flex; align-items: center;
}
.tier__body {
  padding: 2.5mm 3.5mm;
  font-size: 9pt; line-height: 1.4; color: var(--ink);
}
.tier__body strong { color: var(--c-red); font-weight: 600; }

/* Needs pyramid / cards for Dodatek II/H */
.needs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3mm; margin: 4mm 0; }
.need {
  padding: 4mm 3mm; border: 1px solid var(--line);
  background: #fff; text-align: left;
}
.need__n {
  font-family: var(--f-mono); font-size: 8pt; letter-spacing: .15em;
  color: var(--ink-mute); margin-bottom: 1mm;
}
.need__name {
  font-family: var(--f-serif); font-weight: 600;
  font-size: 12pt; color: var(--ink-soft); margin: 0 0 1.5mm;
}
.need__q {
  font-style: italic; font-size: 9pt; color: var(--ink-mute); margin-bottom: 2mm;
}
.need__a { font-size: 9pt; color: var(--ink); line-height: 1.4; }

/* Finance horizons */
.horizons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3mm; margin: 4mm 0; }
.horizon {
  padding: 5mm 4mm; border: 1px solid var(--line); background: #fff;
}
.horizon__tag {
  font-family: var(--f-mono); font-size: 8pt; letter-spacing: .16em;
  color: var(--ink-soft); margin-bottom: 1mm;
}
.horizon__name {
  font-family: var(--f-serif); font-weight: 600;
  font-size: 13pt; color: var(--ink); margin: 0 0 2mm;
}
.horizon__range {
  font-family: var(--f-mono); font-size: 9pt;
  color: var(--ink-mute); margin-bottom: 3mm;
  padding-bottom: 2mm; border-bottom: 1px solid var(--line);
}
.horizon__list { margin: 0; padding: 0; list-style: none; }
.horizon__list li {
  font-size: 9pt; color: var(--ink); padding: 1mm 0;
  padding-left: 4mm; position: relative; line-height: 1.4;
}
.horizon__list li::before { content: "·"; position: absolute; left: 0; color: var(--ink-soft); font-weight: 700; }

/* ===========================================================
   PRINT
=========================================================== */
@media print {
  body { background: #fff; }
  .topbar { display: none; }
  .doc { margin: 0; padding: 0; max-width: none; }
  .page {
    margin: 0; box-shadow: none;
    width: 210mm; height: 297mm;
    page-break-after: always;
  }
  @page { size: A4; margin: 0; }
  .page__num, .page__header, .page__footer { color: #7a8397; }
}

        { p: "Metodiky jsem v praxi používal i spoluutvářel celý profesní život — Scrum, SAFe, Waterfall, jejich hybridy. Co jsem ale dosud nedělal, je psát metodiku pro svět, kde kromě lidí v týmu pracují i AI agenti. Dlouho mi to přišlo předčasné; jenže v určitou chvíli bylo jasné, že čekat, až to napíše někdo jiný, nemá smysl." },
        { p: "Scrum a SAFe v roce 2026 aktivně reagují na AI — Scrum Guide Expansion Pack dostal samostatného průvodce AI and Scrum a Scaled Agile představila AI-Native SAFe (k 31. srpnu 2026 v režimu Early Access). V regulovaných odvětvích se zpřesňují požadavky na průběžné řízení rizik, změn a lidský dohled nad AI systémy. Všechny tyto přístupy ale zůstávají u otázky, kdo s AI pracuje a kdo za ni odpovídá. Co žádná z nich nedotahuje na úroveň exekuce, je <strong>operační model hybridního týmu</strong> — runtime kontrakt pro agenta, který umí za noc zmigrovat padesát serverů, přepsat komponentu nebo vygenerovat draft smlouvy: co mu nechat, co schvalovat a co nikdy. To je prostor, který má zaplnit GALDUR — jako doplňková vrstva, ne náhrada." },
        { p: "GALDUR proto nevznikl z ambice přinést „tu správnou metodiku“. Vznikl z toho, co poslední dva roky dělám sám: používám agenty v rámci experimentů a zejména při vývoji aplikace <strong>Yggaro</strong>. Ta ještě není uvolněná, a to je zároveň upřímný důvod, proč je tahle verze 0.95 — praxe ve větším měřítku, napříč klienty a obory, teprve přijde. Co mám, je zkušenost z vlastního vývoje, z experimentů a z principů, které se v nich ukázaly jako nosné." },

  D.glossary = {
    intro: "Technická terminologie GALDUR. Termíny kurzívou jsou synonyma ze source metodik — uvedeny pro orientaci v tradičních týmech.",
    terms: [
      { term: "Intent",              def: "Strategický záměr — co chceme dosáhnout a proč. Primární jednotka myšlení v GALDUR. NENÍ task, user story, ani specifikace. Lidský originál, ne agentní output." },
      { term: "Intent Spec",         def: "Strukturovaný kontrakt mezi intentem a agentem. Má Header (human-authored) a Execution Body (machine-readable). Primární pracovní artefakt metodiky. Verzovaný v git." },
      { term: "Drift",               def: "Odchylka agentova výstupu od specu. Není chyba — je to <em>signál</em> o kvalitě specu. Typy (viz kap. 08): <strong>D-SCOPE</strong> (scope_drift), <strong>D-CONSTR</strong> (constraint_breach), <strong>D-CONTEXT</strong> (context_miss), <strong>D-ESCAL</strong> (escalation_miss), <strong>D-EXTERNAL</strong> (external_failure)." },
      { term: "Drift Signal",        def: "Událost emitovaná Drift Detectorem. Obsahuje task_id, timestamp, typ, popis, severity. Směřuje do Drift Dashboardu ke Curatorovi." },
      { term: "Drift Score",         def: "Weighted suma drift events per spec. Threshold > 15 triggeruje povinný Trace Audit. Použito jako leading indikátor spec quality." },
      { term: "Trace",               def: "Append-only log každé agentní akce proti specu. Kdo, kdy, co, s jakým výsledkem. Audit trail, nikoli database." },
      { term: "Trace Audit",         def: "GALDUR ekvivalent retrospektivy — ale data-first. Analyzuje drift log, re-kalibruje governance levels, identifikuje failure patterns. Kadence 1–4 týdny, povinný po Hard Lock incidentu." },
      { term: "Validation Gate",     def: "Kontrolní bod před promotion specu do VALIDATED. Curator kontroluje outcome checklist, constraint violations, drift review. Binární rozhodnutí: approve / request_revision / refine_spec / escalate." },
      { term: "Governance Level",    def: "Úroveň autonomie agenta per spec: L0 Autonomous · L1 Supervised · L2 Collaborative · L3 Manual. Definuje, kdy a jak člověk intervenuje. Governance level je per-spec; per-task governance_override je na roadmapě pro v1.x (viz 6.2)." },
      { term: "Hard Lock",           def: "Absolutní zákaz — akce, kterou agent neprovádí nikdy; po explicit human real-time approval ji vykonává člověk. Implementován v governance engine, nelze přepsat specem, override nebo escalací. Incident = P1." },
      { term: "Hard Lock Policy Log", def: "Append-only audit registr všech Hard Lock definic, změn a odstranění. Každá změna vyžaduje Amendment (L3 approval + blameless postmortem dle kap. 10). Primární artefakt pro regulatorní audit a M&A due diligence. Nikdy se nepřepisuje ani nemaže — historie je součást bezpečnostní postury organizace." },
      { term: "Amendment",           def: "Strukturovaná změna existujícího specu. Má Trigger → Proposal → Approval → Apply → Broadcast fáze. První-třídní artefakt, ne administrativní úkon. Bez Amendmentu spec nelze měnit." },
      { term: "Spec Lifecycle State", def: "Jeden z 9 stavů: DRAFT → CRYSTALLIZED → ACTIVE → (ESCALATED ↔ SUSPENDED) → PENDING VALIDATION → VALIDATED → CLOSED, nebo REVERTED. Přechody iniciované agentem vs. člověkem jsou explicitně rozděleny. Nad automatem stojí tři typované vrstvy (v0.95): korekce záznamu, režimy pozastavení, dispozice návrhu." },
      { term: "Korekce záznamu",     def: "Kurátorská zpětná hrana automatu (VALIDATED→ACTIVE, VALIDATED→PENDING VALIDATION, CLOSED→VALIDATED) s povinným důvodem, logovaná v Trace jako korekce. Míra se měří jako validation_correction_rate — vysoká hodnota je signál o podkladech Validation Gate, ne o selhání kurátora." },
      { term: "Parked (SUSPENDED)",  def: "Režim pozastavení: vědomé odstavení specu kurátorem s důvodem, bez 3denního limitu režimu blockage. Parked spec zůstává viditelný v Trace Auditu." },
      { term: "Dispozice návrhu",    def: "Označení DRAFT návrhu jako superseded (s povinným ukazatelem na nástupce) nebo rejected. Stav se nemění; návrh se přestává nabízet jako čekající práce, historie zůstává úplná." },
      { term: "Intent Architect (IA)", def: "<em>≈ Tech Lead / Architect / Product Owner.</em> Formuluje a ohraničuje intent. Píše Intent Specs pro L2/L3 tasky. Vede Trace Audity. Netráví čas implementací." },
      { term: "Agent Curator (AC)",  def: "<em>≈ Senior Dev / SysAdmin / DBA / Domain Expert.</em> Reviduje agentní výstupy na Validation Gates. Domain expert pro svou oblast. Má veto bez zdůvodnění — expert intuition je legitimní governance mechanismus." },
      { term: "Governance Steward (GS)", def: "<em>≈ Scrum Master / DevOps Lead.</em> Monitoruje Drift Dashboard. Triaguje eskalace. Facilituje Trace Audity. Nekoordinuje lidi — koordinuje rozhraní mezi lidmi a agenty." },
      { term: "Governance Engine",   def: "Runtime komponenta: Spec Registry + Trace Store + Drift Detector + Gate Runner + Amendment Log + Hard Lock Enforcer + Dashboard + Notification Bus. Bez engine je GALDUR dokument, ne systém." },
      { term: "Crystallization",     def: "Přechod specu z DRAFT do CRYSTALLIZED. Vyžaduje: všechna povinná pole, governance level definován, dependencies validated, outcome binárně ověřitelné. Vždy iniciovaný člověkem." },
      { term: "Blast Radius",        def: "Rozsah dopadu akce — izolovaný soubor / modul / systém / celá organizace. Vstup do kalibrace governance level. Field <code>risk_assessment.blast_radius</code> ve specu." },
      { term: "Reversibility",       def: "Snadnost undo akce: easy / partial / hard / irreversible. S blast_radius určuje governance level. Irreversible akce jsou L3 kandidáti bez výjimky." },
      { term: "Crew",                def: "Základní organizační jednotka: 1 IA + 1 Steward + 2–5 Curators + agent pool. Schopna dodat 80 % práce bez závislosti na jiné Crew. 5–15 lidí ekvivalent." },
      { term: "Domain Intent Broadcast", def: "Kvartální strukturovaný YAML dokument od Domain IA. Obsahuje priority, kapacitu, cross-domain závislosti, deprioritized items. Nahrazuje PI Planning ze SAFe — 2–4 h přípravy vs. 2 dny." },
      { term: "Portfolio Intent Map", def: "Cross-domain visualization intentů na portfolio layer. Public pro celou organizaci. Zdroj pravdy pro strategic alignment bez kalendářové koordinace." },
      { term: "Spec Header",         def: "Human-authored část Intent Specu: název, intent statement, rationale, constraints, outcome criteria, governance level, risk assessment. Čtená lidmi při review, ne primárně agenty. Změny vyžadují Amendment." },
      { term: "Spec Body",           def: "Machine-readable část Intent Specu (Execution Body): agent_role, tools, scope, validation hooks, budget. Parsovaná Governance Engine, předávaná agentovi. Změny Body bez změny Header jsou povoleny pouze specifickými Amendment typy." },
      { term: "Refinement",          def: "Amendment typu „zpřesnění bez změny záměru“. Typický výstup Validation Gate se stavem <code>refine_spec</code>. Nepožaduje re-crystallization, jen delta approval od IA. Rychlá smyčka pro post-execution poznatky." },
      { term: "Spec Registry",       def: "Primární datový store pro všechny Intent Specs v organizaci. Verzovaný (git-backed), dotazovatelný, referenceable. Source of truth pro „co právě běží“ a „co už proběhlo“. Primární IP asset organizace." },
      { term: "Trace Store",         def: "Append-only log každé agentní akce proti každému specu. Immutable, časově razítkovaný, agregovatelný. Zdroj dat pro Drift Score, Trace Audit, finance reporting, compliance audit." },
      { term: "Cross-Crew Dependency", def: "Formální závislost mezi specs v různých Crew. Zaznamenaná explicitně ve spec fieldu <code>depends_on</code>. Governance engine detekuje cirkularitu a block před ACTIVE přechodem. Nahrazuje PI Planning cross-team commitments." },
      { term: "Amendment Broadcast", def: "Notifikační fáze Amendment lifecycle — všichni subscribeři daného specu (agenti, Curator, závislé Crew) dostanou strukturovanou notifikaci o delta. Bez Broadcastu může Amendment existovat v Registry, ale neaplikuje se na běžící execution." },
      { term: "Amendment Log",       def: "Append-only záznam všech schválených amendments per spec. Kompletní audit trail „kdo, kdy, proč změnil záměr“. Komponenta Governance Engine. Primární artefakt při incident post-mortem a compliance auditu." },
      { term: "Spec Health Score",   def: "Ve v0.95 se nevydává. Pět ukazatelů Spec Health se sleduje samostatně, každý s vlastním prahem (1+ nad prahem → bod v Trace Auditu; 3+ → zásah Governance Stewarda). Složené číslo 0–100 se vrátí až s přesným vzorcem ve v1.0." },
      { term: "Hard Lock Incident Log", def: "Separátní audit log všech Hard Lock triggerů — kdo/co akci iniciovalo, jaký lock se aktivoval, kdo autorizoval override. Immutable, oddělený od běžného Trace Store. Povinný review Stewardem týdně." },
      { term: "Moral Crumple Zone", def: "Pojem Madeleine Clare Elish (2019): situace, kdy člověk v mixed human-agent systému nese morální a právní odpovědnost za selhání, které bylo převážně automatizované. GALDUR tomu předchází explicitní alokací governance level a audit trail pro každé rozhodnutí." },
      { term: "HITL / APR / PAIR / SWARM", def: "Čtyři hybridní vzory lidsko-agentní kolaborace. HITL = Human-in-the-Loop (agent navrhne, člověk schválí). APR = Agent-Primary + Review (agent dokončí celý task, člověk reviduje výsledek). PAIR = člověk a agent pracují paralelně na témže specu. SWARM = N agentů paralelně, člověk (IA) orchestruje. Detaily v Dodatku II/H." },

  const renderers = {

    divider: r_divider, chapter: r_chapter, principles: r_principles,
    roles: r_roles, 'intent-spec': r_intentSpec, 'intent-spec-example': r_intentSpecExample, lifecycle: r_lifecycle, 'lifecycle-ops': r_lifecycleOps,

  // Auto-renumber pages sequentially so that inserting/removing pages
  // in the D.pages registry doesn't require manual renumbering.
  D.pages.forEach((pd, i) => { pd.page = i + 1; });

  // Sync the Table of Contents with the renumbered pages. We match each
  // TOC entry to a page in D.pages and copy its resolved page number over.
  //   · Front/back matter entries match by page type
  //   · Chapter / addendum entries match by divider `num`
  (function syncToc(){
    const findType = (t) => D.pages.find(p => p.type === t);
    const findDivider = (n) => D.pages.find(p => p.type === 'divider' && (p.num === n || ('II/' + p.num) === n));

    // Chapters 09–12 don't have dividers — they're direct page types.
    // Map chapter number → page type so TOC resolves their page numbers.
    const chapterTypeByNum = {
      '09': 'amendment',
      '10': 'hard-locks',
      '11': 'metrics-engine',
      '12': 'gov-engine',
    };

    const byName = {
      'Obsah':                    findType('toc'),
      'Předmluva autora':         findType('essay'),
      'Shrnutí pro manažery':     findType('summary'),
      'Jak číst tento dokument':  findType('reading-guide'),
      'FAQ — otázky, které vždy přijdou': findType('faq'),
      'Glosář — základní pojmy': findType('glossary'),
      'Related Work — GALDUR v kontextu metodik': findType('related-work'),
      'References & Further Reading': findType('references'),
      'Changelog — vývoj metodiky v0.1 → v0.95': findType('changelog'),
      'Amendments — proces a registr změn': findType('amendments-log'),
      'Právní informace a licence': findType('legal-1'),
    };

    D.toc.forEach(sec => sec.items.forEach(item => {
      // Clear any stale hard-coded page — we're re-resolving.
      item.page = undefined;
      // Chapters and addenda use the `num` column (e.g. "01", "I", "IV").
      if (item.num) {
        const d = findDivider(item.num);
        if (d) { item.page = d.page; return; }
        // Chapter without divider — fall back to the page type mapping.
        const tp = chapterTypeByNum[item.num];
        if (tp) {
          const pg = findType(tp);
          if (pg) item.page = pg.page;
        }
        return;
      }
      // Front / back matter entries use the name.
      const match = byName[item.name];
      if (match) item.page = match.page;
    }));
  })();

  // Křížové odkazy na strany v textu ({{p:TYP}}) se doplní až po číslování —
  // ručně psaná čísla stránek lhala po každém vložení strany (7. 9. 2026: str. 26 → 29).
  const resolvePageRefs = (html) => html.replace(/\{\{p:([a-z0-9-]+)\}\}/g, (m, t) => {
    const d = D.pages.find(x => x.type === t); return d ? d.page : '?';
  });

  D.pages.forEach(pd => {
    const fn = renderers[pd.type];
    if (fn) {
      try {
        const pg = fn(pd);
        if (pg.innerHTML.includes('{{p:')) pg.innerHTML = resolvePageRefs(pg.innerHTML);
        doc.appendChild(pg);
      }
      catch(e){
        console.error('Render error on page', pd.page, pd.type, e);
        const err = pageShell(pd.page);
        err.insertAdjacentHTML('beforeend', `<div class="callout callout--red"><div class="callout__label">RENDER ERROR</div><div class="callout__body">Type: ${pd.type}<br>${e.message}</div></div>`);
        doc.appendChild(err);
      }
    } else {
      const miss = pageShell(pd.page);
      miss.insertAdjacentHTML('beforeend', `<div class="callout callout--ochre"><div class="callout__label">CHYBÍ RENDERER</div><div class="callout__body">type: <code>${pd.type}</code></div></div>`);
      doc.appendChild(miss);
    }
  });
})();
